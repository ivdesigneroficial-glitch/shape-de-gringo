<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0A0A0A">
<title>SHAPE DE GRINGO 2.0 — Academia dos Guerreiros</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shape Gringo">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Shape de Gringo 2.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--v2-bg:#0A0A0A;--v2-surface:#141414;--v2-surface-2:#1C1C1C;--v2-border:#2A2A2A;--v2-text:#F5F5F5;--v2-muted:#7A7A7A;--v2-dim:#4A4A4A;--v2-accent-m:#DC2626;--v2-accent-f:#B8536B;--v2-premium:#C9A961;--v2-danger:#B22222;--v2-success:#3D9970}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0A0A0A;color:#F5F5F5;font-family:'Inter',system-ui,-apple-system,sans-serif;margin:0 auto;min-height:100vh;min-height:100dvh;overflow-x:hidden}
body.v2-onboarding{max-width:none;padding-bottom:0}
body:not(.v2-onboarding){max-width:480px;padding-bottom:72px;background:#0B0F19;color:#E5E7EB;font-family:system-ui,-apple-system,sans-serif}
/* ===== V2 · ONBOARDING (Login / Welcome / Countdown) ===== */
.v2-scr{position:fixed;inset:0;z-index:999;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#050505;color:#F5F5F5;font-family:'Inter',sans-serif}
.v2-cine{background:radial-gradient(ellipse at 30% 30%,#3a3a3a 0%,#0a0a0a 70%),radial-gradient(ellipse at 70% 80%,#1a1a1a 0%,#050505 60%);box-shadow:inset 0 0 120px rgba(0,0,0,.95),inset 0 0 60px rgba(220,38,38,.12);filter:grayscale(1) contrast(1.15)}
.v2-cine-f{background:radial-gradient(ellipse at 30% 30%,#3a3a3a 0%,#0a0a0a 70%),radial-gradient(ellipse at 70% 70%,#1a1a1a 0%,#050505 60%);box-shadow:inset 0 0 120px rgba(0,0,0,.95),inset 0 0 60px rgba(184,83,107,.14);filter:grayscale(1) contrast(1.15)}
.v2-noise::after{content:'';position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.03) 1px,transparent 1px);background-size:3px 3px;mix-blend-mode:overlay}
.v2-vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 25%,#0A0A0A 90%);pointer-events:none}
.v2-tint-m{position:absolute;inset:0;background:linear-gradient(180deg,rgba(220,38,38,.06),transparent 50%);pointer-events:none}
.v2-tint-f{position:absolute;inset:0;background:linear-gradient(180deg,rgba(184,83,107,.06),transparent 50%);pointer-events:none}
.v2-card{background:rgba(10,10,10,.9);border:1px solid #2A2A2A;border-radius:8px;padding:28px;display:flex;flex-direction:column;gap:16px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.v2-brand{font-family:'Anton',sans-serif;letter-spacing:2px;line-height:1;color:#F5F5F5}
.v2-brand-rule{height:2px;background:#DC2626;margin-top:12px}
.v2-brand-rule.f{background:#B8536B}
.v2-tagline{font-family:'Playfair Display',serif;font-style:italic;color:#7A7A7A;margin-top:12px}
.v2-quote{font-family:'Inter',sans-serif;font-size:13px;color:#7A7A7A;font-style:italic;border-left:2px solid #DC2626;padding-left:12px;line-height:1.5;transition:opacity .3s}
.v2-quote.f{border-left-color:#B8536B}
.v2-label{font-family:'JetBrains Mono',monospace;font-size:10px;color:#4A4A4A;letter-spacing:2px}
.v2-gender-row{display:flex;gap:12px}
.v2-gender{flex:1;aspect-ratio:1.1;position:relative;border:1px solid #2A2A2A;border-radius:6px;overflow:hidden;opacity:.5;cursor:pointer;transition:opacity .2s}
.v2-gender.sel{opacity:1;border-width:2px}
.v2-gender.sel.m{border-color:#DC2626;box-shadow:0 0 24px rgba(220,38,38,.35)}
.v2-gender.sel.f{border-color:#B8536B;box-shadow:0 0 24px rgba(184,83,107,.35)}
.v2-gender-bg{position:absolute;inset:0}
.v2-gender-fade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.9) 100%)}
.v2-gender-label{position:absolute;left:12px;bottom:12px;font-family:'Anton',sans-serif;font-size:20px;letter-spacing:2px;color:#F5F5F5}
.v2-avatar-row{display:flex;gap:6px;flex-wrap:wrap}
.v2-avatar{width:38px;height:38px;border:1px solid #2A2A2A;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#7A7A7A;cursor:pointer;background:#141414;transition:all .2s}
.v2-avatar.sel{border-width:2px;color:#F5F5F5}
.v2-avatar.sel.m{border-color:#DC2626}
.v2-avatar.sel.f{border-color:#B8536B}
.v2-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.v2-chips::-webkit-scrollbar{display:none}
.v2-chip{padding:8px 14px;background:#141414;border:1px solid #2A2A2A;color:#F5F5F5;font-family:'Inter',sans-serif;font-weight:600;font-size:11px;letter-spacing:1px;border-radius:999px;white-space:nowrap;cursor:pointer;transition:all .2s}
.v2-chip.sel{color:#fff;font-weight:700;border-color:transparent}
.v2-chip.sel.m{background:#DC2626}
.v2-chip.sel.f{background:#B8536B}
.v2-input-wrap{display:flex;flex-direction:column;gap:6px}
.v2-input{height:56px;background:#141414;border:1px solid #2A2A2A;border-radius:4px;display:flex;align-items:center;padding:0 16px;transition:border-color .2s}
.v2-input:focus-within.m{border-color:#DC2626}
.v2-input:focus-within.f{border-color:#B8536B}
.v2-input input{flex:1;background:none;border:0;outline:0;color:#F5F5F5;font-family:'Inter',sans-serif;font-size:16px;letter-spacing:1px;min-width:0}
.v2-input input[type=password]{letter-spacing:8px}
.v2-input input::placeholder{color:#4A4A4A;letter-spacing:1px}
.v2-eye{color:#7A7A7A;cursor:pointer;width:20px;height:20px;flex-shrink:0}
.v2-err{color:#DC2626;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1px;min-height:14px}
.v2-remember{display:flex;align-items:center;gap:10px;font-family:'Inter',sans-serif;font-size:13px;color:#7A7A7A;cursor:pointer;user-select:none}
.v2-toggle{width:32px;height:18px;background:#2A2A2A;border-radius:999px;position:relative;transition:background .2s;flex-shrink:0}
.v2-toggle.on.m{background:#DC2626}
.v2-toggle.on.f{background:#B8536B}
.v2-toggle-knob{position:absolute;left:2px;top:2px;width:14px;height:14px;background:#fff;border-radius:50%;transition:left .2s}
.v2-toggle.on .v2-toggle-knob{left:16px}
.v2-btn{height:60px;border:0;color:#fff;font-family:'Inter',sans-serif;font-weight:700;font-size:15px;letter-spacing:2px;border-radius:4px;cursor:pointer;transition:transform .1s,box-shadow .2s;display:flex;align-items:center;justify-content:center;gap:12px;text-transform:uppercase}
.v2-btn.m{background:#DC2626;box-shadow:0 8px 32px rgba(220,38,38,.35)}
.v2-btn.f{background:#B8536B;box-shadow:0 8px 32px rgba(184,83,107,.35)}
.v2-btn.m:hover{box-shadow:0 8px 40px rgba(220,38,38,.55)}
.v2-btn.f:hover{box-shadow:0 8px 40px rgba(184,83,107,.55)}
.v2-btn:active{transform:scale(.98)}
.v2-btn-ghost{background:none;border:0;color:#7A7A7A;font-family:'Inter',sans-serif;font-size:12px;cursor:pointer;text-align:center;padding:8px}
.v2-btn-ghost:hover{color:#F5F5F5}
.v2-shake{animation:v2Shake .4s ease}
@keyframes v2Shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.v2-scroll-fix{-webkit-overflow-scrolling:touch;overflow-y:auto}
/* ===== V2 · WELCOME + COUNTDOWN ===== */
.v2-welcome{position:fixed;inset:0;z-index:1001;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.v2-welcome-header{position:absolute;top:20px;left:20px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#7A7A7A;letter-spacing:2px}
.v2-welcome-footer{position:absolute;bottom:24px;left:0;right:0;text-align:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:#7A7A7A;letter-spacing:3px}
.v2-video-frame{width:100%;max-width:1024px;aspect-ratio:16/9;background:#0A0A0A;border:1px solid #2A2A2A;border-radius:4px;position:relative;overflow:hidden}
.v2-video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.v2-video-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.v2-play-btn{width:96px;height:96px;border-radius:50%;background:rgba(220,38,38,.15);border:1.5px solid #DC2626;display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px rgba(220,38,38,.5);cursor:pointer;transition:transform .2s}
.v2-play-btn:hover{transform:scale(1.08)}
.v2-play-btn svg{width:36px;height:36px;fill:#DC2626;margin-left:6px}
.v2-video-caption{position:absolute;left:32px;bottom:24px;right:32px;font-family:'Playfair Display',serif;font-size:22px;font-style:italic;color:#F5F5F5;text-shadow:0 2px 12px rgba(0,0,0,.9)}
.v2-welcome-skip{position:absolute;top:20px;right:20px;background:none;border:1px solid #2A2A2A;color:#7A7A7A;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2px;padding:8px 14px;border-radius:4px;cursor:pointer;display:none}
.v2-welcome-skip.show{display:block}
.v2-welcome-skip:hover{color:#F5F5F5;border-color:#DC2626}
.v2-countdown{position:fixed;inset:0;z-index:1002;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
.v2-countdown-glow{position:absolute;inset:0;background:radial-gradient(circle at center,rgba(220,38,38,.15) 0%,transparent 40%)}
.v2-cd-num{font-family:'Anton',sans-serif;line-height:1;color:#DC2626;text-shadow:0 0 80px rgba(220,38,38,.6);animation:v2CdPulse 1s ease-out}
@keyframes v2CdPulse{0%{transform:scale(.6);opacity:0}30%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
.v2-cd-footer{position:absolute;bottom:60px;left:0;right:0;text-align:center;font-family:'JetBrains Mono',monospace;font-size:12px;color:#7A7A7A;letter-spacing:6px}
.v2-enter{position:fixed;inset:0;z-index:1003;background:#000;display:flex;align-items:center;justify-content:center;animation:v2EnterFade .8s ease-out forwards}
@keyframes v2EnterFade{0%{opacity:1}70%{opacity:1}100%{opacity:0;pointer-events:none}}
.v2-enter-brand{text-align:center}
.v2-enter-brand div:first-child{font-family:'Anton',sans-serif;font-size:56px;letter-spacing:3px;color:#DC2626;text-shadow:0 0 40px rgba(220,38,38,.6);animation:v2EnterPulse .8s ease}
.v2-enter-brand div:last-child{font-family:'JetBrains Mono',monospace;font-size:12px;color:#7A7A7A;letter-spacing:6px;margin-top:16px}
@keyframes v2EnterPulse{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
/* Login responsive layout */
.v2-login{min-height:100vh;min-height:100dvh;position:relative;background:#050505}
.v2-login-bg{position:absolute;inset:0;opacity:.35}
.v2-login-inner{position:relative;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.v2-login-inner > .v2-card{width:100%;max-width:480px}
@media (min-width:768px){
  .v2-login-bg{opacity:.4}
  .v2-login-inner{padding:60px}
  .v2-login-inner > .v2-card{max-width:520px;padding:36px}
  .v2-brand{font-size:56px}
}
@media (min-width:1200px){
  .v2-login-inner > .v2-card{max-width:480px;padding:32px}
  .v2-brand{font-size:48px}
}
@media (max-width:480px){
  .v2-card{padding:24px 20px;gap:14px;border-radius:0;border-left:0;border-right:0;background:transparent;backdrop-filter:none}
  .v2-brand{font-size:38px}
  .v2-tagline{font-size:14px}
  .v2-login-inner{padding:20px 0;align-items:flex-start}
  .v2-avatar{width:36px;height:36px}
}
/* V2 · pilares do login (preenchem espaço vazio) */
.v2-pillars{margin-top:16px;padding-top:20px;border-top:1px solid #1E1E1E}
.v2-pillars-title{font-family:'JetBrains Mono',monospace;font-size:10px;color:#4A4A4A;letter-spacing:2.5px;text-align:center;margin-bottom:16px;font-weight:600}
.v2-pillars-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.v2-pillar{padding:14px 10px;background:#141414;border:1px solid #2A2A2A;border-radius:4px;text-align:center;transition:border-color .2s,transform .2s}
.v2-pillar:hover{border-color:#DC2626;transform:translateY(-2px)}
.v2-pillar-num{font-family:'Anton',sans-serif;font-size:40px;color:#DC2626;line-height:1;letter-spacing:1px}
.v2-pillar-label{font-family:'JetBrains Mono',monospace;font-size:9px;color:#B0B0B0;letter-spacing:1.5px;margin-top:6px;font-weight:600}
.v2-pillars-cta{text-align:center;padding:8px 0 4px}
.v2-pillars-cta-quote{font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:18px;color:#F5F5F5;line-height:1.3;letter-spacing:-.3px}
.v2-pillars-cta-arrow{font-family:'JetBrains Mono',monospace;font-size:9px;color:#DC2626;letter-spacing:2.5px;margin-top:14px;font-weight:600;animation:v2ArrowBounce 2s ease-in-out infinite}
@keyframes v2ArrowBounce{0%,100%{transform:translateY(0);opacity:.7}50%{transform:translateY(-4px);opacity:1}}
/* ===== V2 · HOME (Netflix-style QG) ===== */
body.v2-home-active{max-width:none!important;padding-bottom:0!important;background:#050505!important;color:#F5F5F5!important;font-family:'Inter',sans-serif!important;display:block!important}
.v2-home{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.v2-home-topbar{position:sticky;top:0;z-index:10;height:56px;background:#0A0A0A;border-bottom:1px solid #2A2A2A;display:flex;align-items:center;padding:0 20px;justify-content:space-between}
.v2-home-logo{font-family:'Anton',sans-serif;font-size:22px;color:#DC2626;letter-spacing:2px;cursor:pointer}
.v2-home-logo.f{color:#B8536B}
.v2-home-topbar-right{display:flex;gap:14px;color:#7A7A7A;align-items:center}
.v2-icon-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:#7A7A7A;cursor:pointer;border-radius:4px;transition:background .2s,color .2s}
.v2-icon-btn:hover{color:#F5F5F5;background:#141414}
.v2-icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.v2-home-streak{display:flex;align-items:center;gap:6px;padding:6px 12px;background:#141414;border:1px solid #2A2A2A;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:#DC2626}
.v2-home-streak.f{color:#B8536B}
.v2-home-streak svg{width:12px;height:12px;fill:currentColor}
.v2-home-main{flex:1;padding-bottom:80px;overflow-x:hidden;min-width:0}
.v2-hero{position:relative;height:320px;overflow:hidden}
.v2-hero-bg{position:absolute;inset:0}
.v2-hero-fade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.95) 100%)}
.v2-hero-content{position:absolute;left:20px;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:2}
.v2-hero-kicker{font-family:'JetBrains Mono',monospace;font-size:10px;color:#DC2626;letter-spacing:2px;font-weight:600}
.v2-hero-kicker.f{color:#B8536B}
.v2-hero-title{font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:26px;line-height:1.05;color:#F5F5F5;letter-spacing:-.5px;margin:0}
.v2-hero-sub{font-family:'Inter',sans-serif;font-size:12px;color:#B0B0B0;line-height:1.4;margin:0}
.v2-hero-btns{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
.v2-hero-btn{height:44px;padding:0 22px;background:#DC2626;border:0;color:#fff;font-family:'Inter',sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;border-radius:4px;cursor:pointer;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px;transition:transform .1s,box-shadow .2s;box-shadow:0 4px 20px rgba(220,38,38,.25)}
.v2-hero-btn.f{background:#B8536B;box-shadow:0 4px 20px rgba(184,83,107,.25)}
.v2-hero-btn:hover{transform:translateY(-1px)}
.v2-hero-btn:active{transform:scale(.98)}
.v2-hero-btn-ghost{height:44px;padding:0 18px;background:transparent;border:1px solid #2A2A2A;color:#F5F5F5;font-family:'Inter',sans-serif;font-weight:600;font-size:11px;letter-spacing:2px;border-radius:4px;cursor:pointer;text-transform:uppercase}
.v2-hero-btn-ghost:hover{border-color:#F5F5F5}
.v2-progress-strip{padding:16px 20px;background:#050505}
.v2-progress-strip-head{display:flex;justify-content:space-between;margin-bottom:8px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;color:#7A7A7A}
.v2-progress-strip-head .v{color:#F5F5F5}
.v2-progress-bar{display:flex;gap:2px;height:8px;border-radius:2px;overflow:hidden}
.v2-progress-bar>div{background:#DC2626;transition:flex .3s}
.v2-progress-bar>div.empty{background:#1A1A1A}
.v2-progress-bar.f>div:not(.empty){background:#B8536B}
.v2-row{padding:20px 0 6px}
.v2-row-head{display:flex;align-items:center;gap:12px;padding:0 20px;margin-bottom:12px}
.v2-row-title{font-family:'Anton',sans-serif;font-size:16px;letter-spacing:2px;color:#F5F5F5}
.v2-row-rule{height:1px;background:#DC2626;width:40px}
.v2-row-rule.f{background:#B8536B}
.v2-row-rule.gold{background:#C9A961}
.v2-row-more{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:#7A7A7A;cursor:pointer;letter-spacing:1px;background:none;border:0;padding:6px}
.v2-row-more:hover{color:#F5F5F5}
.v2-row-scroll{display:flex;gap:10px;overflow-x:auto;padding:0 20px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.v2-row-scroll::-webkit-scrollbar{display:none}
.v2-card-continue{min-width:220px;height:130px;background:#141414;border:1px solid #2A2A2A;border-radius:4px;position:relative;overflow:hidden;cursor:pointer;flex-shrink:0;transition:transform .2s,border-color .2s}
.v2-card-continue:hover{transform:translateY(-2px);border-color:#DC2626}
.v2-card-continue.f:hover{border-color:#B8536B}
.v2-card-bg{position:absolute;inset:0;opacity:.7}
.v2-card-fade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.94) 100%)}
.v2-card-play-badge{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:rgba(220,38,38,.2);border:1px solid #DC2626;display:flex;align-items:center;justify-content:center}
.v2-card-play-badge.f{background:rgba(184,83,107,.2);border-color:#B8536B}
.v2-card-play-badge svg{width:11px;height:11px;fill:#DC2626;margin-left:1px}
.v2-card-play-badge.f svg{fill:#B8536B}
.v2-card-content{position:absolute;left:12px;right:12px;bottom:10px;z-index:2}
.v2-card-content .t{font-family:'Playfair Display',serif;font-weight:700;font-size:14px;color:#F5F5F5;line-height:1.15}
.v2-card-content .m{font-family:'JetBrains Mono',monospace;font-size:9px;color:#B0B0B0;letter-spacing:1.5px;margin-top:4px}
.v2-card-aula{min-width:130px;height:200px;background:#141414;border:1px solid #2A2A2A;border-radius:4px;position:relative;overflow:hidden;cursor:pointer;flex-shrink:0;transition:transform .2s,border-color .2s}
.v2-card-aula:hover{transform:translateY(-3px);border-color:#DC2626}
.v2-card-aula.pro:hover{border-color:#C9A961}

.v2-poster-tag{position:absolute;top:8px;right:8px;padding:2px 6px;background:#DC2626;color:#fff;font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:700;letter-spacing:1px;z-index:2}

.v2-poster-content{position:absolute;left:12px;right:12px;bottom:12px;z-index:2}
.v2-poster-kicker{font-family:'JetBrains Mono',monospace;font-size:8px;color:#DC2626;letter-spacing:1.5px;margin-bottom:4px;font-weight:600}

.v2-poster-kicker.gold{color:#C9A961}
.v2-poster-title{font-family:'Playfair Display',serif;font-weight:700;font-size:15px;line-height:1.15;color:#F5F5F5}
.v2-poster-meta{font-family:'Inter',sans-serif;font-size:11px;color:#7A7A7A;margin-top:4px}
.v2-pro-cta{margin-top:28px;padding:24px;background:linear-gradient(135deg,#1a1408,#141414);border:1px solid #C9A961;border-radius:4px;text-align:center}
.v2-pro-cta-title{font-family:'Anton',sans-serif;font-size:20px;letter-spacing:2px;color:#C9A961;margin-bottom:6px}
.v2-pro-cta-sub{font-family:'Inter',sans-serif;font-size:13px;color:#B0B0B0;line-height:1.5;margin-bottom:16px}
.v2-btn-gold{height:48px;padding:0 26px;background:#C9A961;border:0;color:#0A0A0A;font-family:'Inter',sans-serif;font-weight:700;font-size:13px;letter-spacing:2px;border-radius:4px;cursor:pointer;text-transform:uppercase;display:inline-flex;align-items:center;gap:10px;transition:transform .1s,box-shadow .2s;box-shadow:0 4px 20px rgba(201,169,97,.25)}

.v2-pro-code-link{font-family:'Inter',sans-serif;font-size:12px;color:#7A7A7A;margin-top:14px}
.v2-pro-code-link button{background:none;border:0;color:#C9A961;font-weight:700;cursor:pointer;text-decoration:underline}
/* ===== V2 · BIBLIOTECA (livros) ===== */
.v2-grid-books{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}

@media(min-width:900px){.v2-grid-books{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1300px){.v2-grid-books{grid-template-columns:repeat(5,1fr)}}
.v2-book{aspect-ratio:3/4;position:relative;border-radius:4px;overflow:hidden;cursor:pointer;padding:16px;display:flex;flex-direction:column;transition:transform .2s,border-color .2s;border:1px solid;color:#F5F5F5;box-sizing:border-box}

.v2-book-noise{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.02) 1px,transparent 1px);background-size:4px 4px;pointer-events:none}

.v2-book-title{font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:22px;line-height:1;margin-top:auto;position:relative}
.v2-book-rule{width:24px;height:1px;margin:12px 0 8px;position:relative}
.v2-book-tag{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1.5px;font-weight:600;position:relative}

.v2-book-lock-icon{position:absolute;top:12px;right:12px;color:#C9A961;z-index:2}
.v2-book-lock-icon svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.v2-bundle-cta{margin-top:28px;padding:32px 24px;background:#DC2626;border-radius:4px;position:relative;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;color:#0A0A0A}

.v2-bundle-cta-kicker{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2.5px;font-weight:700}
.v2-bundle-cta-title{font-family:'Anton',sans-serif;font-size:32px;letter-spacing:1.5px;margin:8px 0;line-height:1}
.v2-bundle-cta-sub{font-family:'Inter',sans-serif;font-size:14px;font-weight:500;opacity:.9}
.v2-bundle-cta-btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.v2-bundle-cta-btn{background:#0A0A0A;color:#F5F5F5;border:0;padding:12px 20px;font-family:'Inter',sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;cursor:pointer;text-transform:uppercase;border-radius:2px}
.v2-bundle-cta-btn.ghost{background:transparent;border:1.5px solid #0A0A0A;color:#0A0A0A}
/* ===== V2 · LOJA PRO (edições) ===== */
.v2-pro-hero{position:relative;height:300px;background:#141414;border-radius:4px;overflow:hidden;margin-bottom:32px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:32px}

.v2-pro-hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(201,169,97,.15);border:1px solid #C9A961;padding:6px 14px;border-radius:20px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#C9A961;font-weight:700;letter-spacing:2px;margin-top:12px}

.v2-section-h{font-family:'Anton',sans-serif;font-size:20px;letter-spacing:2px;color:#F5F5F5;margin:36px 0 16px;display:flex;align-items:center;gap:12px}
.v2-section-h::after{content:'';flex:1;height:1px;background:#C9A961;max-width:80px}
.v2-grid-apps{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:700px){.v2-grid-apps{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1100px){.v2-grid-apps{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1400px){.v2-grid-apps{grid-template-columns:repeat(5,1fr)}}
.v2-app-tile{padding:20px 16px;background:#141414;border:1px solid #2A2A2A;border-radius:4px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:transform .2s,border-color .2s;min-height:180px}
.v2-app-tile:hover{transform:translateY(-2px);border-color:#C9A961}
.v2-app-tile.soon{opacity:.5}
.v2-app-tile-icon{width:48px;height:48px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:24px}
.v2-app-tile-name{font-family:'Anton',sans-serif;font-size:15px;letter-spacing:1.5px;color:#F5F5F5;line-height:1.1}
.v2-app-tile-desc{font-family:'Inter',sans-serif;font-size:12px;color:#B0B0B0;line-height:1.4;flex:1}
.v2-app-tile-tag{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1.5px;font-weight:600;margin-top:auto;color:#C9A961}

.v2-editions{display:grid;grid-template-columns:1fr;gap:20px;margin-top:20px}

.v2-edition{background:#141414;border:1px solid #2A2A2A;border-radius:4px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,border-color .2s,box-shadow .2s;position:relative}

.v2-edition-badge{position:absolute;top:14px;right:14px;padding:4px 10px;background:#C9A961;color:#0A0A0A;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;letter-spacing:1.5px;z-index:2}

.v2-edition-cover-tint{position:absolute;inset:0;mix-blend-mode:multiply;z-index:2;pointer-events:none}

.v2-edition-cover-tint.gold{background:radial-gradient(ellipse at 50% 40%,rgba(201,169,97,.35) 0%,transparent 60%)}

.v2-edition-body{padding:24px;display:flex;flex-direction:column;gap:14px;flex:1}
.v2-edition-kicker{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;color:#C9A961;font-weight:600}
.v2-edition-name{font-family:'Anton',sans-serif;font-size:36px;letter-spacing:2px;color:#F5F5F5;line-height:1}
.v2-edition-price{font-family:'Anton',sans-serif;font-size:32px;color:#F5F5F5;letter-spacing:1px}

.v2-edition-list{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:8px;font-family:'Inter',sans-serif;font-size:13px;color:#B0B0B0}
.v2-edition-list li{display:flex;align-items:flex-start;gap:8px;line-height:1.4}
.v2-edition-list li::before{content:'✓';color:#3D9970;font-weight:700;flex-shrink:0}
.v2-edition-list li.strong{color:#F5F5F5;font-weight:600}
.v2-edition-cta{margin-top:auto;height:48px;background:#DC2626;border:0;color:#fff;font-family:'Inter',sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;border-radius:4px;cursor:pointer;text-transform:uppercase}
.v2-edition-cta.f{background:#B8536B}
.v2-edition-cta.gold{background:#C9A961;color:#0A0A0A}

.v2-edition-cta:hover{opacity:.9}
.v2-code-strip{margin-top:32px;padding:20px;background:#141414;border:1px solid #2A2A2A;border-radius:4px;display:flex;flex-direction:column;gap:12px;align-items:stretch}

.v2-selos-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px;gap:16px}

.v2-selo.locked{opacity:.4}
.v2-selo-emoji{font-size:36px;line-height:1}

.v2-stats-header-kicker{font-family:'JetBrains Mono',monospace;font-size:10px;color:#DC2626;letter-spacing:3px;font-weight:600}

.v2-stats-header-title{font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:32px;line-height:1;color:#F5F5F5;margin-top:8px;letter-spacing:-.5px}

.v2-kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px}

function showWelcome(){

  el.innerHTML=`
    <div class="v2-welcome-header">SHAPE DE GRINGO · WELCOME</div>
    <button class="v2-welcome-skip" id="welcome-skip">PULAR ▶</button>
    <div class="v2-video-frame">

    </div>
    <div class="v2-welcome-footer">ASSISTA PARA CONTINUAR</div>`;
  document.body.appendChild(el);
  const skipBtn=document.getElementById('welcome-skip');
  const advance=()=>{el.remove();startCountdown();};
  skipBtn.onclick=advance;
  const iframe=document.getElementById('wv-iframe');
  window.addEventListener('message',function onMsg(e){
    try{
      const d=typeof e.data==='string'?JSON.parse(e.data):e.data;
      if(d.event==='onStateChange'&&d.info===0){window.removeEventListener('message',onMsg);advance();}
    }catch(ex){}
  });
  iframe.onload=function(){iframe.contentWindow.postMessage('{"event":"command","func":"addEventListener","args":["onStateChange"]}','*');};
  setTimeout(()=>{skipBtn.classList.add('show');},5000);
}

function startCountdown(){
  document.body.classList.add('v2-onboarding');
  let count=5;
  const cdEl=document.createElement('div');cdEl.className='v2-countdown';cdEl.id='welcome-cd';
  const isMobile=window.matchMedia('(max-width:480px)').matches;
  const isTablet=window.matchMedia('(max-width:1024px)').matches;
  const size=isMobile?280:isTablet?340:400;
  function paint(){
    cdEl.innerHTML=`<div class="v2-countdown-glow"></div><div class="v2-cd-num" style="font-size:${size}px" key="${count}">${count}</div><div class="v2-cd-footer">PREPARE-SE</div>`;
  }
  paint();document.body.appendChild(cdEl);
  const ci=setInterval(()=>{
    count--;
    if(count<=0){clearInterval(ci);cdEl.remove();startEntryTransition();return;}
    paint();
  },1000);
}

function startEntryTransition(){
  markWelcomeSeen();
  document.body.classList.add('v2-onboarding');
  const te=document.createElement('div');te.className='v2-enter';te.id='welcome-enter';
  te.innerHTML=`<div class="v2-enter-brand"><div>SHAPE DE GRINGO</div><div>ENTRAR NA ACADEMIA</div></div>`;
  document.body.appendChild(te);
  setTimeout(()=>{
    te.remove();
    document.body.classList.remove('v2-onboarding');
    render();
  },1400);
}

function resetAll(){if(confirm("RESETAR TUDO?")){S.started=false;S.startDate=null;S.completed={};S.exerciseDone={};S.swapped={};save();render()}}
function toggleEx(d,id){if(S.completed[d])return;if(!S.exerciseDone[d])S.exerciseDone[d]={};S.exerciseDone[d][id]=!S.exerciseDone[d][id];save();render()}
function completeDay(d){const wo=WORKOUTS[d-1],ed=S.exerciseDone[d]||{};if(!wo.exercises.every((_,i)=>ed[i]))return;S.completed[d]=true;save();S.modal={badge:BADGES.find(b=>b.day===d),reward:REWARDS.find(r=>r.day===d),quote:CQUOTES[Math.floor(Math.random()*CQUOTES.length)]};render()}
function closeModal(){S.modal=null;S.proCodeInput="";S.proCodeError="";S.pdfCodeInput="";S.pdfCodeError="";render()}
function goScreen(sc,d){S.screen=sc;if(d!==undefined)S.selectedDay=d;render()}
function toggleSwap(day,id){const k=day+'-'+id;S.swapOpen[k]=!S.swapOpen[k];render()}
function doSwap(day,id,altText){const parts=altText.match(/^(.+)\s(\d+x\d+s?|\d+x\d+\/lado|\d+s|\d+)$/);const k=day+'-'+id;if(parts){S.swapped[k]={n:parts[1].trim(),r:parts[2]}}else{S.swapped[k]={n:altText,r:""}}S.swapOpen[k]=false;save();render()}
function undoSwap(day,id){const k=day+'-'+id;delete S.swapped[k];save();render()}
function showExVideo(name){const url=gExVid(name);if(!url){S.modal={type:'exVideoNone',name};render();return}S.modal={type:'exVideo',name,url};render()}
function openPdf(id){const p=PDFS.find(x=>x.id===id);if(p.paid&&!isPdfUl(id)){S.modal={type:'pdfBuy',pdf:p};render();return}S.modal={type:'pdf',pdf:p};render()}
function readPdf(u){if(u)window.open(u,'_blank')}
function tryPdfCode(pid){const cfg=FIXED_PDF,inp=S.pdfCodeInput.trim().toUpperCase();if(!inp){S.pdfCodeError="Digite o código.";render();return}if(cfg.bundleCode&&inp===cfg.bundleCode.toUpperCase()){ulAllPdf();S.pdfCodeInput="";S.pdfCodeError="";S.modal={type:'pdfSuccess',isBundle:true};render();return}const pc=cfg['pdf_'+pid];if(pc&&pc.code&&inp===pc.code.toUpperCase()){ulPdf(pid);S.pdfCodeInput="";S.pdfCodeError="";S.modal={type:'pdfSuccess',isBundle:false,pdf:PDFS.find(p=>p.id===pid)};render();return}S.pdfCodeError="Inválido!";render()}

function openBundleKiwify(){if(FIXED_PDF.bundleKiwifyUrl)window.open(FIXED_PDF.bundleKiwifyUrl,'_blank');else alert('Link não configurado.')}
function openVideo(id){const v=VIDEOS.find(x=>x.id===id);if(v.pro&&!isPro()){S.modal={type:'proBuy'};render();return}const u=gVU(id);if(!u){S.modal={type:'videoSoon',video:v};render();return}S.modal={type:'videoPlay',video:v};render()}

// V2 · STATS
function renderStatsV2(){
  const p=S.userProfile||{},g=p.gender||'M',isF=g==='F',accent=isF?'f':'m';
  const c=cc(),rk=gRank(),sk=gStreak(),cd=cDay();
  const totalReps=Object.values(S.exerciseDone).reduce((a,d)=>a+Object.values(d).filter(Boolean).length,0);
  // maior streak histórico (aproximação: percorre completed)
  let maxStreak=0,curStreak=0;
  for(let d=1;d<=30;d++){
    if(S.completed[d]){curStreak++;if(curStreak>maxStreak)maxStreak=curStreak;}
    else curStreak=0;
  }
  // próxima patente
  const rkIdx=RANKS.indexOf(rk);
  const nextRk=RANKS[rkIdx+1];
  const nextRkPct=nextRk?Math.min(100,Math.round((c-rk.min)/(nextRk.min-rk.min)*100)):100;

  // gráfico 30 dias
  let bars='';
  const todayD=cDay();
  for(let d=1;d<=30;d++){
    const done=!!S.completed[d];
    const isToday=d===todayD;
    if(done){
      const h=60+((d*7)%40); // Pseudo-varied height entre 60-100%
      bars+=`<div class="v2-chart-bar ${accent} ${isToday?'today':''}" style="height:${h}%" title="Dia ${d} ✓"></div>`;
    } else if(isToday){
      bars+=`<div class="v2-chart-bar ${accent} ${isToday?'today':''}" style="height:30%;opacity:.4" title="Dia ${d} · hoje"></div>`;
    } else {
      bars+=`<div class="v2-chart-bar empty" style="height:12%" title="Dia ${d}"></div>`;
    }
  }

  const ranks=RANKS.map(r=>{
    const u=c>=r.min;
    return `
      <div class="v2-rank-row ${u?'':'locked'}">
        <div class="v2-rank-row-icon">${r.icon}</div>
        <div class="v2-rank-row-name">${esc(r.name)}</div>
        <div class="v2-rank-row-req">${r.min===0?'INÍCIO':r.min+' DIAS'}</div>
        ${u?'<div class="v2-rank-row-check">✓</div>':''}
      </div>`;
  }).join('');

  const quote=nextRk?`"Você já é mais forte que quem parou no dia 3. Falta ${nextRk.min-c} dia${nextRk.min-c===1?'':'s'} pra virar ${esc(nextRk.name.toUpperCase())}."`:`"Você chegou ao topo. Agora vira mentor dos seus."`;

  const inner=`
    <div class="v2-content-page">
      <div class="v2-stats-header">
        <div>
          <div class="v2-stats-header-kicker ${accent}">SEUS NÚMEROS · DIA ${cd}/30</div>
          <h1 class="v2-stats-header-title">Stats de Guerra</h1>
        </div>
        <button class="v2-btn-danger-outline" onclick="if(confirm('RESETAR TUDO?\\n\\nIsso apaga TODO seu progresso (${c} dias, ${totalReps} exercícios). Sem volta.\\n\\nTem certeza?')){resetAll()}">RESETAR PROGRESSO</button>
      </div>
      <div class="v2-kpi-grid">
        <div class="v2-kpi accent ${accent}">
          <div class="v2-kpi-label">DIAS COMPLETADOS</div>
          <div class="v2-kpi-value">${c}<span class="v2-kpi-suffix">/30</span></div>
        </div>
        <div class="v2-kpi">
          <div class="v2-kpi-label">🔥 STREAK ATUAL</div>
          <div class="v2-kpi-value">${sk}<span class="v2-kpi-suffix"> DIAS</span></div>
        </div>
        <div class="v2-kpi gold">
          <div class="v2-kpi-label">PATENTE</div>
          <div class="v2-kpi-value">
            <span style="font-size:32px">${rk.icon}</span>
            <span>${esc(rk.name.toUpperCase())}</span>
          </div>
        </div>
        <div class="v2-kpi">
          <div class="v2-kpi-label">MAIOR STREAK</div>
          <div class="v2-kpi-value">${maxStreak}<span class="v2-kpi-suffix"> DIAS</span></div>
        </div>
      </div>
      <div class="v2-stats-lower">
        <div class="v2-chart-card">
          <div class="v2-chart-head">
            <span>ATIVIDADE · 30 DIAS</span>
            <span class="a">${totalReps} REPS TOTAIS</span>
          </div>
          <div class="v2-chart-bars">${bars}</div>
          <div class="v2-chart-footer"><span>D 01</span><span>D 15</span><span>D 30</span></div>
        </div>
        <div class="v2-next-rank">
          <div>
            <div class="v2-next-rank-kicker">${nextRk?'PRÓXIMA PATENTE':'PATENTE MÁXIMA'}</div>
            <div class="v2-next-rank-name">${nextRk?esc(nextRk.name.toUpperCase()):'GENERAL'}</div>
          </div>
          ${nextRk?`
          <div>
            <div class="v2-next-rank-bar"><div style="width:${nextRkPct}%"></div></div>
            <div class="v2-next-rank-meta"><span>${c-rk.min}/${nextRk.min-rk.min} DIAS</span><span>${nextRkPct}%</span></div>
          </div>`:''}
          <div class="v2-next-rank-quote">${quote}</div>
        </div>
      </div>
      <div class="v2-rank-ladder">
        <div class="v2-rank-ladder-title">🎖️ ESCADA DE PATENTES</div>
        ${ranks}
      </div>
      <div class="v2-account-actions">
        ${S.adminUnlocked?'<button class="v2-account-btn" onclick="S.adminUnlocked=false;LS.set(\'adminUnlocked\',false);render()">🔒 TRANCAR ADMIN</button>':'<button class="v2-account-btn" onclick="const pw=prompt(\'Senha admin:\');if(pw===ADMIN_PW){S.adminUnlocked=true;LS.set(\'adminUnlocked\',true);render()}else if(pw!==null){alert(\'Senha incorreta.\')}">🔐 ABRIR PAINEL ADMIN</button>'}
        <button class="v2-account-btn" onclick="logout()">🚪 SAIR DA ACADEMIA</button>
      </div>
    </div>`;
  return v2Frame('stats',inner);
}
