<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0608">
<title>🔥 Protocolo Hormonal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0a0608;color:#e8e0d8;font-family:system-ui,-apple-system,sans-serif;max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-bottom:72px;overflow-x:hidden}

/* PALETTE: Deep crimson + burnt orange + bone white */
:root{--bg:#0a0608;--card:#12090c;--border:#1f1318;--accent:#dc2626;--accent2:#ea580c;--accent3:#f59e0b;--bone:#e8e0d8;--muted:#8a7e76;--dim:#5c524a;--green:#22c55e;--purple:#a855f7}

.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:14px;border:1px solid var(--border)}

/* NAV */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:100}
.nav-item{flex:1;text-align:center;padding:10px 0;cursor:pointer;transition:color .2s}
.nav-item.active{color:var(--accent)}

/* HEADER */
.header{padding:18px 18px 8px;display:flex;justify-content:space-between;align-items:center}
.header-left .h-title{font-size:16px;font-weight:900;color:var(--accent);letter-spacing:1px}
.header-left .h-sub{font-size:10px;color:var(--dim);letter-spacing:1px;margin-top:2px}
.header-right{display:flex;align-items:center;gap:10px}
.streak-badge{background:var(--accent)15;border:1px solid var(--accent)30;border-radius:10px;padding:6px 12px;text-align:center}
.streak-num{font-size:16px;font-weight:900;color:var(--accent)}
.streak-label{font-size:8px;color:var(--dim);letter-spacing:1px}

/* MAIN CONTENT */
.content{padding:0 16px}

/* HORMONE METER */
.meter{position:relative;text-align:center;padding:20px 0}
.meter-ring{position:relative;width:160px;height:160px;margin:0 auto}
.meter-svg{width:160px;height:160px;transform:rotate(-90deg)}
.meter-bg{fill:none;stroke:var(--border);stroke-width:10}
.meter-fill{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1.5s ease,stroke 1s ease}
.meter-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.meter-val{font-size:36px;font-weight:900;color:#fff}
.meter-label{font-size:9px;color:var(--dim);letter-spacing:2px;font-weight:700;margin-top:2px}
.meter-status{margin-top:10px;font-size:11px;font-weight:700;letter-spacing:1px}

/* PILLAR TAGS */
.pillar-scroll{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch}
.pillar-tag{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:1px;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--muted);transition:all .3s;white-space:nowrap}
.pillar-tag.active{border-color:var(--accent);color:var(--accent);background:var(--accent)08}

/* MISSION CARD */
.mission{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;transition:all .3s;position:relative;overflow:hidden}
.mission.done{opacity:.5}
.mission.done::after{content:'';position:absolute;inset:0;background:rgba(34,197,94,.03);pointer-events:none}
.mission-top{display:flex;align-items:flex-start;gap:12px}
.mission-check{width:28px;height:28px;border-radius:8px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .3s;font-size:12px;color:transparent}
.mission-check.checked{border-color:var(--green);background:var(--green);color:#fff}
.mission-body{flex:1}
.mission-pillar{font-size:8px;font-weight:700;letter-spacing:2px;margin-bottom:3px}
.mission-title{font-size:14px;font-weight:700;color:#fff;margin-bottom:4px}
.mission-desc{font-size:11px;color:var(--muted);line-height:1.6}
.mission-science{font-size:9px;color:var(--dim);margin-top:6px;padding-top:6px;border-top:1px solid var(--border);line-height:1.5;font-style:italic}
.mission-science b{color:var(--accent2);font-style:normal}
.mission-duration{position:absolute;top:16px;right:16px;font-size:9px;color:var(--dim);font-weight:700;letter-spacing:1px}
.mission-xp{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;color:var(--accent3);margin-top:6px;letter-spacing:1px}

/* DAILY INSIGHT */
.insight{background:linear-gradient(135deg,#1a0a10,var(--card));border:1px solid var(--accent)15;border-radius:14px;padding:18px;margin-bottom:14px}
.insight-label{font-size:8px;color:var(--accent);letter-spacing:3px;font-weight:700;margin-bottom:8px}
.insight-text{font-size:14px;color:var(--bone);line-height:1.7;font-style:italic}
.insight-source{font-size:9px;color:var(--dim);margin-top:8px}

/* PROGRESS SCREEN */
.prog-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;text-align:center}
.prog-card-icon{font-size:28px;margin-bottom:4px}
.prog-card-val{font-size:22px;font-weight:900;color:#fff}
.prog-card-label{font-size:9px;color:var(--dim);letter-spacing:1px;font-weight:700}
.prog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}

/* LEVEL BAR */
.level-bar{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
.level-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.level-name{font-size:14px;font-weight:800;color:var(--accent)}
.level-next{font-size:10px;color:var(--dim)}
.level-track{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.level-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent3));transition:width 1s ease}

/* RANKINGS */
.rank-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.rank-item:last-child{border-bottom:none}
.rank-pos{font-size:14px;font-weight:900;width:28px;text-align:center}
.rank-icon{font-size:24px}
.rank-name{font-size:13px;font-weight:700;color:#fff}
.rank-req{font-size:10px;color:var(--dim)}

/* LEARN SCREEN */
.article{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:12px;cursor:pointer;transition:border-color .3s}
.article:hover{border-color:var(--accent)30}
.article-cat{font-size:8px;font-weight:700;letter-spacing:2px;margin-bottom:6px}
.article-title{font-size:15px;font-weight:800;color:#fff;margin-bottom:4px}
.article-desc{font-size:11px;color:var(--muted);line-height:1.5}
.article-meta{font-size:9px;color:var(--dim);margin-top:8px;display:flex;gap:12px}

/* SETTINGS SCREEN */
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border)}
.setting-row:last-child{border-bottom:none}
.setting-left{display:flex;align-items:center;gap:10px}
.setting-icon{font-size:18px}
.setting-name{font-size:13px;font-weight:600;color:var(--bone)}
.toggle{width:42px;height:24px;border-radius:12px;background:var(--border);cursor:pointer;position:relative;transition:background .3s}
.toggle.on{background:var(--accent)}
.toggle-knob{width:20px;height:20px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:transform .3s}
.toggle.on .toggle-knob{transform:translateX(18px)}

/* ANIMATIONS */
.fade{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseGlow{0%,100%{filter:drop-shadow(0 0 8px var(--accent)40)}50%{filter:drop-shadow(0 0 16px var(--accent)60)}}

/* SCREEN CONTAINERS */
.screen{display:none}.screen.active{display:block}
</style>
</head>

    {t:"Zero álcool hoje",d:"Nenhuma gota de álcool. Nem cerveja, nem vinho, nem dose.",sci:"Álcool reduz testosterona em 6.8% por dose e eleva aromatase (conversão T→estrogênio). — Alcoholism: Clinical and Experimental Research, 2004",dur:"Dia todo",xp:35},
    {t:"Durma sem cueca/roupa apertada",d:"Durma sem cueca ou com cueca samba-canção. Nada apertado na região.",sci:"Boxers vs briefs: homens que usam cuecas soltas têm contagem espermática 25% maior. Temperatura testicular importa. — Human Reproduction, 2018",dur:"Noite",xp:20},
    {t:"Evite plásticos quentes",d:"Não esquente comida em plástico no microondas. Use vidro ou cerâmica.",sci:"BPA e ftalatos de plásticos aquecidos são disruptores endócrinos que reduzem T em até 10%. — Environmental Health Perspectives, 2013",dur:"Dia todo",xp:25},
    {t:"Postura de poder — 5 min",d:"Fique em pé com peito aberto, mãos na cintura, queixo levantado por 5 minutos.",sci:"Posturas expansivas elevam testosterona em 20% e reduzem cortisol em 25% em 2 minutos. — Psychological Science, 2010 (Carney et al.)",dur:"5 min",xp:20},
    {t:"Competição saudável",d:"Jogue algo competitivo hoje: esporte, game, debate, aposta amigável.",sci:"Competição e vitória elevam T agudamente. Mesmo antecipar competição gera pico hormonal. — Hormones and Behavior, 2006",dur:"30 min",xp:30},
    {t:"Contato social masculino",d:"Passe tempo com amigos homens. Conversa, esporte, churrasco. Sem telas.",sci:"Interação social masculina de qualidade eleva T e ocitocina simultaneamente. Isolamento reduz ambos. — Adaptive Human Behavior, 2015",dur:"60 min",xp:30},
    {t:"Desafio de desconforto",d:"Faça algo desconfortável intencionalmente: conversa difícil, banho frio, treino mais pesado.",sci:"Exposição voluntária a estresse agudo (eustress) eleva T e resiliência. Conforto crônico suprime eixo HPG. — Frontiers in Endocrinology, 2019",dur:"Variável",xp:35},
  ]
};

// === LEVELS ===
const LEVELS=[
  {name:'Iniciante',icon:'🔰',min:0},
  {name:'Desperto',icon:'⚡',min:200},
  {name:'Guerreiro',icon:'⚔️',min:500},
  {name:'Dominante',icon:'🔥',min:1000},
  {name:'Alpha',icon:'🐺',min:1800},
  {name:'Titã',icon:'🗿',min:3000},
  {name:'Supremo',icon:'👑',min:5000}
];

// === DAILY QUOTES ===
const QUOTES=[
  "Seu corpo produz a droga mais poderosa do mundo. Otimize a fábrica.",
  "Testosterona não se compra. Se constrói.",
  "Cada hábito é um tijolo na fortaleza hormonal.",
  "O homem moderno é deficiente por design. Rebele-se.",
  "Sol, frio, ferro e sono. A fórmula que ninguém vende porque é grátis.",
  "Cortisol é o imposto que o estresse cobra do seu shape.",
  "Enquanto você scrolla, seu cortisol sobe e sua T desce.",
  "A natureza te projetou pra ser forte. A sociedade te projetou pra ser manso.",
  "Mais sol, menos tela. Mais ferro, menos sofá. Mais silêncio, menos ruído.",
  "Seu avô tinha mais testosterona que você sem tomar nada. Pense nisso."
];

// === STATE ===
const LS={get(k){try{return JSON.parse(localStorage.getItem("ph_"+k))}catch{return null}},set(k,v){try{localStorage.setItem("ph_"+k,JSON.stringify(v))}catch{}}};
let S={
  screen:'home',
  streak:LS.get('streak')||0,
  xp:LS.get('xp')||0,
  completedToday:LS.get('completedToday')||{},
  lastDay:LS.get('lastDay')||'',
  totalCompleted:LS.get('totalCompleted')||0,
  daysActive:LS.get('daysActive')||0,
  pillarFilter:'all',
  settings:{notif:true,darkMode:true,sound:true}
};

function save(){LS.set('streak',S.streak);LS.set('xp',S.xp);LS.set('completedToday',S.completedToday);LS.set('lastDay',S.lastDay);LS.set('totalCompleted',S.totalCompleted);LS.set('daysActive',S.daysActive)}
function today(){return new Date().toISOString().slice(0,10)}
function dayOfYear(){const n=new Date(),s=new Date(n.getFullYear(),0,0);return Math.floor((n-s)/864e5)}

// Check new day
function checkDay(){
  const t=today();
  if(S.lastDay!==t){
    if(S.lastDay&&isYesterday(S.lastDay)){S.streak++}else if(S.lastDay){S.streak=1}else{S.streak=1}
    S.completedToday={};S.lastDay=t;S.daysActive++;save()
  }
}
function isYesterday(d){const y=new Date();y.setDate(y.getDate()-1);return d===y.toISOString().slice(0,10)}

// Generate daily missions (deterministic based on day — infinite unique combos)
function getDailyMissions(){
  const doy=dayOfYear();const missions=[];const pillars=Object.keys(MISSIONS);
  // 7 missions per day, cycling through pillars with offset
  for(let i=0;i<7;i++){
    const pIdx=(doy+i)%pillars.length;
    const pillar=pillars[pIdx];
    const pool=MISSIONS[pillar];
    const mIdx=(doy*7+i*13+doy%3)%pool.length; // pseudo-random but deterministic
    missions.push({...pool[mIdx],pillar,id:`${doy}-${i}`});
  }
  return missions;
}

function getLevel(){return[...LEVELS].reverse().find(l=>S.xp>=l.min)||LEVELS[0]}
function getNextLevel(){const cur=getLevel();const idx=LEVELS.indexOf(cur);return idx<LEVELS.length-1?LEVELS[idx+1]:null}
function getLevelProgress(){const cur=getLevel();const next=getNextLevel();if(!next)return 100;return Math.min(100,Math.round((S.xp-cur.min)/(next.min-cur.min)*100))}

function completeMission(id,xp){
  if(S.completedToday[id])return;
  S.completedToday[id]=true;S.xp+=xp;S.totalCompleted++;save();render();
}

function todayProgress(){
  const m=getDailyMissions();
  const done=m.filter(x=>S.completedToday[x.id]).length;
  return Math.round(done/m.length*100);
}

function getPillarInfo(id){return PILLARS.find(p=>p.id===id)}

// === RENDER ===
function render(){
  checkDay();
  const app=document.getElementById('app');
  const screens={home:renderHome,progress:renderProgress,learn:renderLearn,settings:renderSettings};
  const content=screens[S.screen]?screens[S.screen]():'';
  const navItems=[
    {id:'home',icon:'🔥',label:'Hoje'},
    {id:'progress',icon:'📊',label:'Progresso'},
    {id:'learn',icon:'📖',label:'Aprender'},
    {id:'settings',icon:'⚙️',label:'Config'}
  ];
  const nav=`<div class="nav">${navItems.map(n=>`<div class="nav-item ${S.screen===n.id?'active':''}" onclick="S.screen='${n.id}';render()" style="color:${S.screen===n.id?'var(--accent)':'var(--dim)'}"><div style="font-size:18px">${n.icon}</div><div style="font-size:9px;font-weight:700;margin-top:2px">${n.label}</div></div>`).join('')}</div>`;
  app.innerHTML=renderHeader()+`<div class="content fade">${content}</div>`+nav;
}

function renderHeader(){
  const lvl=getLevel();
  return`<div class="header"><div class="header-left"><div class="h-title">🔥 PROTOCOLO HORMONAL</div><div class="h-sub">${lvl.icon} ${lvl.name} · DIA ${S.daysActive||1}</div></div><div class="header-right"><div class="streak-badge"><div class="streak-num">🔥 ${S.streak}</div><div class="streak-label">STREAK</div></div></div></div>`;
}

function renderHome(){
  const missions=getDailyMissions();
  const prog=todayProgress();
  const quote=QUOTES[dayOfYear()%QUOTES.length];
  const filtered=S.pillarFilter==='all'?missions:missions.filter(m=>m.pillar===S.pillarFilter);
  const doneCount=missions.filter(m=>S.completedToday[m.id]).length;

  let h='';

  // Meter
  const r=65,c=2*Math.PI*r,o=c-c*prog/100;
  const meterColor=prog<30?'var(--accent)':prog<70?'var(--accent2)':'var(--green)';
  h+=`<div class="card" style="text-align:center;border-color:${prog>=100?'var(--green)30':'var(--border)'}">
    <div class="meter"><div class="meter-ring">
      <svg class="meter-svg" viewBox="0 0 160 160"><circle class="meter-bg" cx="80" cy="80" r="${r}"/><circle class="meter-fill" cx="80" cy="80" r="${r}" stroke="${meterColor}" stroke-dasharray="${c}" stroke-dashoffset="${o}"/></svg>
      <div class="meter-center"><div class="meter-val">${prog}%</div><div class="meter-label">PROTOCOLO</div></div>
    </div>
    <div class="meter-status" style="color:${meterColor}">${doneCount}/${missions.length} MISSÕES · ${prog>=100?'PROTOCOLO COMPLETO ✓':'EM ANDAMENTO'}</div>
  </div></div>`;

  // Level bar
  const lvl=getLevel(),next=getNextLevel(),lp=getLevelProgress();
  h+=`<div class="level-bar"><div class="level-top"><div class="level-name">${lvl.icon} ${lvl.name}</div><div class="level-next">${next?next.icon+' '+next.name+' →':''} ${S.xp} XP</div></div><div class="level-track"><div class="level-fill" style="width:${lp}%"></div></div></div>`;

  // Insight
  h+=`<div class="insight"><div class="insight-label">💡 INSIGHT DO DIA</div><div class="insight-text">"${quote}"</div></div>`;

  // Pillar filter
  h+=`<div class="pillar-scroll"><div class="pillar-tag ${S.pillarFilter==='all'?'active':''}" onclick="S.pillarFilter='all';render()">TODAS</div>`;
  PILLARS.forEach(p=>{h+=`<div class="pillar-tag ${S.pillarFilter===p.id?'active':''}" onclick="S.pillarFilter='${p.id}';render()" style="${S.pillarFilter===p.id?'border-color:'+p.color+';color:'+p.color:''}">${p.icon} ${p.name}</div>`});
  h+=`</div>`;

  // Missions
  filtered.forEach(m=>{
    const p=getPillarInfo(m.pillar);
    const done=S.completedToday[m.id];
    h+=`<div class="mission ${done?'done':''}">
      <div class="mission-duration">${m.dur}</div>
      <div class="mission-top">
        <div class="mission-check ${done?'checked':''}" onclick="completeMission('${m.id}',${m.xp})">${done?'✓':''}</div>
        <div class="mission-body">
          <div class="mission-pillar" style="color:${p.color}">${p.icon} ${p.name}</div>
          <div class="mission-title" style="${done?'text-decoration:line-through':''}">${m.t}</div>
          <div class="mission-desc">${m.d}</div>
          <div class="mission-science">📚 <b>Ciência:</b> ${m.sci}</div>
          <div class="mission-xp">⚡ +${m.xp} XP</div>
        </div>
      </div>
    </div>`;
  });

  return h;
}

function renderProgress(){
  const lvl=getLevel(),next=getNextLevel(),lp=getLevelProgress();
  let h='';

  h+=`<div style="text-align:center;padding:10px 0"><div style="font-size:48px;margin-bottom:6px">${lvl.icon}</div><div style="font-size:20px;font-weight:900;color:var(--accent)">${lvl.name}</div><div style="font-size:12px;color:var(--dim);margin-top:4px">${S.xp} XP TOTAL</div></div>`;

  h+=`<div class="level-bar"><div class="level-top"><div class="level-name">${lvl.icon} ${lvl.name}</div><div class="level-next">${next?'Próximo: '+next.icon+' '+next.name+' ('+next.min+' XP)':'NÍVEL MÁXIMO'}</div></div><div class="level-track"><div class="level-fill" style="width:${lp}%"></div></div></div>`;

  h+=`<div class="prog-grid">
    <div class="prog-card"><div class="prog-card-icon">🔥</div><div class="prog-card-val">${S.streak}</div><div class="prog-card-label">STREAK</div></div>
    <div class="prog-card"><div class="prog-card-icon">📅</div><div class="prog-card-val">${S.daysActive||1}</div><div class="prog-card-label">DIAS ATIVOS</div></div>
    <div class="prog-card"><div class="prog-card-icon">✅</div><div class="prog-card-val">${S.totalCompleted}</div><div class="prog-card-label">MISSÕES</div></div>
  </div>`;

  // Rankings
  h+=`<div class="card"><div style="font-size:12px;font-weight:800;color:var(--accent);letter-spacing:1px;margin-bottom:12px">🏆 HIERARQUIA</div>`;
  LEVELS.forEach(l=>{
    const unlocked=S.xp>=l.min;
    h+=`<div class="rank-item" style="opacity:${unlocked?1:.4}"><div class="rank-pos" style="color:${unlocked?'var(--accent)':'var(--dim)'}">${l.icon}</div><div style="flex:1"><div class="rank-name" style="color:${unlocked?'#fff':'var(--dim)'}">${l.name}</div><div class="rank-req">${l.min} XP</div></div>${unlocked?'<span style="color:var(--green)">✓</span>':''}</div>`;
  });
  h+=`</div>`;

  // Pillar stats
  h+=`<div class="card"><div style="font-size:12px;font-weight:800;color:var(--accent);letter-spacing:1px;margin-bottom:12px">📊 PILARES</div>`;
  PILLARS.forEach(p=>{
    h+=`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)"><span style="font-size:18px">${p.icon}</span><div style="flex:1"><div style="font-size:12px;font-weight:700;color:${p.color}">${p.name}</div><div style="font-size:10px;color:var(--dim)">${p.desc}</div></div></div>`;
  });
  h+=`</div>`;

  return h;
}

function renderLearn(){
  const articles=[
    {cat:'TESTOSTERONA',color:'var(--accent)',title:'O que realmente aumenta testosterona naturalmente',desc:'Revisão de 47 estudos sobre métodos comprovados.',time:'8 min'},
    {cat:'SONO',color:'#7c3aed',title:'O papel do sono profundo na produção hormonal',desc:'Como cada fase do sono afeta GH e testosterona.',time:'6 min'},
    {cat:'NUTRIÇÃO',color:'var(--accent2)',title:'Alimentos que destroem sua testosterona',desc:'Soja, açúcar, álcool e mais: o que a ciência diz.',time:'7 min'},
    {cat:'FRIO',color:'#0ea5e9',title:'Exposição ao frio: o protocolo Wim Hof explicado',desc:'Como o frio afeta noradrenalina, dopamina e T.',time:'10 min'},
    {cat:'ESTRESSE',color:'var(--green)',title:'Cortisol: o assassino silencioso da testosterona',desc:'Como o estresse crônico destrói seu perfil hormonal.',time:'5 min'},
    {cat:'TREINO',color:'var(--accent)',title:'Os 5 exercícios que mais elevam testosterona',desc:'Compostos pesados vs isolados: o que a ciência mostra.',time:'6 min'},
    {cat:'HÁBITOS',color:'var(--accent3)',title:'Pornografia e testosterona: a relação científica',desc:'O que acontece com seus hormônios na abstinência.',time:'8 min'},
    {cat:'VITAMINAS',color:'var(--accent2)',title:'Zinco, Magnésio e D3: a tríade hormonal',desc:'Por que esses 3 suplementos são não-negociáveis.',time:'5 min'},
  ];
  let h=`<div style="text-align:center;padding:10px 0 20px"><div style="font-size:32px;margin-bottom:6px">📖</div><div style="font-size:18px;font-weight:900;color:var(--accent)">BASE DE CONHECIMENTO</div><div style="font-size:11px;color:var(--dim);margin-top:4px">Artigos baseados em ciência</div></div>`;
  articles.forEach(a=>{
    h+=`<div class="article"><div class="article-cat" style="color:${a.color}">${a.cat}</div><div class="article-title">${a.title}</div><div class="article-desc">${a.desc}</div><div class="article-meta"><span>📚 ${a.time} leitura</span><span>🔬 Peer-reviewed</span></div></div>`;
  });
  return h;
}

function renderSettings(){
  let h=`<div style="text-align:center;padding:10px 0 20px"><div style="font-size:32px;margin-bottom:6px">⚙️</div><div style="font-size:18px;font-weight:900;color:var(--accent)">CONFIGURAÇÕES</div></div>`;
  h+=`<div class="card">`;
  [{icon:'🔔',name:'Notificações',key:'notif'},{icon:'🌙',name:'Modo escuro',key:'darkMode'},{icon:'🔊',name:'Sons',key:'sound'}].forEach(s=>{
    const on=S.settings[s.key];
    h+=`<div class="setting-row"><div class="setting-left"><div class="setting-icon">${s.icon}</div><div class="setting-name">${s.name}</div></div><div class="toggle ${on?'on':''}" onclick="S.settings.${s.key}=!S.settings.${s.key};render()"><div class="toggle-knob"></div></div></div>`;
  });
  h+=`</div>`;

  h+=`<div class="card"><div style="font-size:12px;font-weight:800;color:var(--accent);letter-spacing:1px;margin-bottom:12px">📊 ESTATÍSTICAS</div>
    <div style="font-size:12px;color:var(--muted);line-height:2.2">
      Dias ativos: <b style="color:#fff">${S.daysActive||1}</b><br>
      Missões completadas: <b style="color:#fff">${S.totalCompleted}</b><br>
      XP total: <b style="color:#fff">${S.xp}</b><br>
      Nível: <b style="color:var(--accent)">${getLevel().name}</b><br>
      Maior streak: <b style="color:#fff">${S.streak}</b>
    </div>
  </div>`;

  h+=`<div class="card" style="text-align:center"><button onclick="if(confirm('Resetar todo progresso?')){S.streak=0;S.xp=0;S.completedToday={};S.lastDay='';S.totalCompleted=0;S.daysActive=0;save();render()}" style="background:var(--accent);color:#fff;border:none;border-radius:8px;padding:12px 24px;font-weight:800;font-size:12px;cursor:pointer;letter-spacing:1px">🔄 RESETAR PROGRESSO</button></div>`;

  return h;
}

// INIT
checkDay();
render();
</script>
