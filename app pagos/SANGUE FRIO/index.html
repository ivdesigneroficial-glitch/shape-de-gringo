<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0C0C0C">
<title>💢 Sangue Frio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --stone:#1C1C1E;--stone2:#2C2C2E;--stone3:#3A3A3C;
  --ice:#E8EDF2;--ice2:#B0BEC5;--ice3:#78909C;
  --steel:#546E7A;--steel2:#37474F;--steel2:#263238;
  --blood:#C62828;--blood2:#E53935;--blood3:#FF5252;
  --gold:#B8860B;--gold2:#DAA520;--gold3:#FFD700;
  --smoke:#9E9E9E;--smoke2:#757575;--smoke3:#616161;
  --bg:#0C0C0C;--bg2:#111111;--bg3:#161616;
  --border:#2A2A2A;--border2:#333;
  --txt:#E8EDF2;--muted:#78909C;--muted2:#546E7A;
}
body{background:var(--bg);color:var(--txt);font-family:'Georgia',serif;max-width:480px;margin:0 auto;min-height:100vh;overflow-x:hidden;padding-bottom:80px}

/* ── TYPOGRAPHY ── */
.font-mono{font-family:'Courier New',Courier,monospace}
.font-sans{font-family:system-ui,-apple-system,sans-serif}

/* ── ANIMATIONS ── */
.fade-in{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.breathe{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.04);opacity:1}}
.flicker{animation:flicker 3s ease-in-out infinite}
@keyframes flicker{0%,100%{opacity:1}45%{opacity:.95}50%{opacity:.6}55%{opacity:.95}}
.slide-in{animation:slideIn .5s cubic-bezier(.25,.46,.45,.94)}
@keyframes slideIn{from{transform:translateX(-20px);opacity:0}to{transform:translateX(0);opacity:1}}
.pulse-blood{animation:pulseBlood 2s ease-in-out infinite}
@keyframes pulseBlood{0%,100%{box-shadow:0 0 0 0 rgba(198,40,40,.4)}70%{box-shadow:0 0 0 12px rgba(198,40,40,0)}}

/* ── ONBOARD ── */
#onboard{position:fixed;inset:0;z-index:500;background:var(--bg);overflow-y:auto;display:flex;align-items:flex-start;justify-content:center}
.ob-wrap{width:100%;max-width:440px;padding:40px 24px 60px;text-align:center}

/* ── STOIC BUTTONS ── */
.btn-stoic{
  border:1px solid var(--border2);
  border-radius:2px;
  padding:14px 24px;
  font-weight:700;font-size:14px;
  cursor:pointer;width:100%;
  letter-spacing:2px;text-transform:uppercase;
  transition:all .2s;font-family:'Courier New',monospace;
  background:transparent;color:var(--ice);
  position:relative;overflow:hidden;
}
.btn-stoic::before{content:'';position:absolute;inset:0;background:var(--ice);transform:scaleX(0);transform-origin:left;transition:transform .3s ease;z-index:0}
.btn-stoic:active::before{transform:scaleX(1)}
.btn-stoic:active{color:var(--bg)}
.btn-stoic span{position:relative;z-index:1}
.btn-blood{border-color:var(--blood2);color:var(--blood3)}
.btn-blood::before{background:var(--blood2)}
.btn-blood:active{color:#fff}
.btn-gold{border-color:var(--gold2);color:var(--gold3)}
.btn-gold::before{background:var(--gold2)}
.btn-gold:active{color:var(--bg)}
.btn-sm-stoic{padding:10px 18px;font-size:12px}
.btn-pill{border-radius:999px;letter-spacing:1px}

/* ── STOIC CARDS ── */
/* Framed card — like an ancient manuscript */
.card-frame{
  border:1px solid var(--border2);
  position:relative;padding:20px;margin-bottom:14px;
  background:var(--bg2);
}
.card-frame::before,.card-frame::after{
  content:'';position:absolute;
  width:8px;height:8px;
  border-color:var(--ice3);border-style:solid;
}
.card-frame::before{top:-1px;left:-1px;border-width:2px 0 0 2px}
.card-frame::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
/* Dark iron card */
.card-iron{background:linear-gradient(135deg,var(--stone),var(--bg2));border:1px solid var(--border);border-radius:0;padding:18px;margin-bottom:12px}
/* Ember card */
.card-ember{background:linear-gradient(135deg,rgba(198,40,40,.06),var(--bg2));border:1px solid rgba(198,40,40,.25);border-left:3px solid var(--blood2);padding:18px;margin-bottom:12px}
/* Roman column layout */
.col-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* ── STAT BLOCKS (Roman style) ── */
.stat-roman{
  border:1px solid var(--border2);padding:14px 10px;
  text-align:center;background:var(--bg2);
  position:relative;
}
.stat-roman::before{
  content:'';position:absolute;top:3px;left:3px;right:3px;bottom:3px;
  border:1px solid rgba(255,255,255,.04);pointer-events:none;
}
.stat-num{font-family:'Courier New',monospace;font-size:28px;font-weight:700;line-height:1}
.stat-lbl{font-size:9px;letter-spacing:2px;color:var(--muted);margin-top:5px;font-family:system-ui,sans-serif}

/* ── PROGRESS ── */
.prog-track{background:var(--stone2);height:2px;width:100%;position:relative}
.prog-fill{height:100%;background:var(--ice3);transition:width .8s ease;position:relative}
.prog-fill::after{content:'';position:absolute;right:0;top:-3px;width:8px;height:8px;background:var(--ice);border-radius:50%}
.prog-segmented{display:flex;gap:3px}
.prog-seg{flex:1;height:4px;background:var(--stone2);border-radius:1px;transition:background .4s}
.prog-seg.done{background:var(--ice3)}
.prog-seg.current{background:var(--blood2)}

/* ── NAV — stoic bar ── */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg2);border-top:1px solid var(--border2);display:flex;z-index:100}
.nav-item{flex:1;text-align:center;padding:10px 0 8px;cursor:pointer;transition:all .2s;border-right:1px solid var(--border)}
.nav-item:last-child{border-right:none}
.nav-icon{font-size:18px;line-height:1}
.nav-label{font-size:8px;font-weight:700;margin-top:2px;letter-spacing:2px;font-family:'Courier New',monospace;text-transform:uppercase}

/* ── OVERLAY / MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:300;padding:20px;overflow-y:auto}
.modal-stoic{background:var(--bg2);border:1px solid var(--border2);max-width:380px;width:100%;max-height:90vh;overflow-y:auto;padding:28px;position:relative}
.modal-stoic::before,.modal-stoic::after{content:'';position:absolute;width:12px;height:12px;border-color:var(--ice3);border-style:solid}
.modal-stoic::before{top:-1px;left:-1px;border-width:2px 0 0 2px}
.modal-stoic::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}

/* ── MISSION ROW (different from magnetismo) ── */
.mission-row{
  display:flex;align-items:stretch;gap:0;
  margin-bottom:8px;cursor:pointer;
  border:1px solid var(--border);
  transition:border-color .2s;
}
.mission-row:active{opacity:.8}
.mission-row.done{border-color:rgba(232,237,242,.15)}
.mission-row.done .mission-main{opacity:.55}
.mission-num{
  width:44px;flex-shrink:0;
  background:var(--stone2);
  display:flex;align-items:center;justify-content:center;
  font-family:'Courier New',monospace;font-size:13px;
  color:var(--muted);font-weight:700;
  border-right:1px solid var(--border);
}
.mission-num.done-num{background:var(--stone3);color:var(--ice3)}
.mission-main{flex:1;padding:14px 14px 14px 16px;background:var(--bg2)}
.mission-check-stoic{
  width:44px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;border-left:1px solid var(--border);
  background:var(--bg2);
}

/* ── QUOTE DISPLAY ── */
.quote-stoic{
  border-left:2px solid var(--ice3);
  padding:14px 18px;
  margin:16px 0;
  background:rgba(255,255,255,.02);
}
.quote-text-s{font-family:'Georgia',serif;font-size:15px;font-style:italic;color:var(--ice2);line-height:1.7;margin-bottom:8px}
.quote-attr{font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;color:var(--muted)}

/* ── LESSON (Scroll / Papyrus feel) ── */
.scroll-card{
  background:var(--bg2);
  border:1px solid var(--border2);
  margin-bottom:10px;
  cursor:pointer;transition:all .2s;
  position:relative;overflow:hidden;
}
.scroll-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ice3);opacity:.5}
.scroll-card:active{opacity:.8}
.scroll-inner{padding:16px 18px 16px 22px;display:flex;align-items:center;gap:14px}

/* ── VIRTUES GRID ── */
.virtue-card{
  border:1px solid var(--border);
  padding:16px 12px;text-align:center;
  background:var(--bg2);cursor:pointer;transition:all .3s;
  position:relative;overflow:hidden;
}
.virtue-card.active{border-color:var(--ice3);background:rgba(232,237,242,.04)}
.virtue-card::after{content:'';position:absolute;inset:0;background:var(--ice);opacity:0;transition:opacity .2s}
.virtue-card:active::after{opacity:.04}
.virtue-icon{font-size:28px;display:block;margin-bottom:8px}
.virtue-name{font-family:'Courier New',monospace;font-size:11px;letter-spacing:2px;color:var(--ice2);font-weight:700}
.virtue-desc{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.4;font-family:system-ui,sans-serif}

/* ── BREATHING CIRCLE ── */
.breath-circle{
  width:150px;height:150px;border-radius:50%;
  border:1px solid var(--ice3);
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;margin:0 auto;
  position:relative;cursor:pointer;
  transition:all .3s;
}
.breath-circle::before{
  content:'';position:absolute;inset:-6px;border-radius:50%;
  border:1px solid rgba(232,237,242,.12);
}
.breath-circle::after{
  content:'';position:absolute;inset:-12px;border-radius:50%;
  border:1px solid rgba(232,237,242,.06);
}
.breath-num{font-family:'Courier New',monospace;font-size:36px;font-weight:700;color:var(--ice);line-height:1}
.breath-lbl{font-size:10px;letter-spacing:3px;color:var(--muted);font-family:system-ui,sans-serif}

/* ── ACHIEVEMENT (Roman medal) ── */
.medal-card{
  border:1px solid var(--border);padding:14px;
  text-align:center;background:var(--bg2);
  position:relative;
}
.medal-card.won{border-color:rgba(184,134,11,.4);background:rgba(184,134,11,.04)}
.medal-icon{font-size:30px;margin-bottom:4px;display:block}
.medal-name{font-size:11px;font-weight:700;font-family:'Courier New',monospace;letter-spacing:1px;color:var(--ice2)}
.medal-desc{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.4}

/* ── DAILY REFLECTION ── */
.reflect-area{
  background:var(--bg2);border:1px solid var(--border2);
  width:100%;min-height:100px;padding:14px;
  color:var(--ice2);font-size:14px;font-family:'Georgia',serif;
  resize:none;outline:none;line-height:1.7;
}
.reflect-area::placeholder{color:var(--muted2);font-style:italic}
.reflect-area:focus{border-color:var(--ice3)}

/* ── AVATAR STOIC ── */
.av-stoic{
  width:70px;height:70px;border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;font-size:36px;
  position:relative;background:var(--bg2);
}
.av-stoic.sel{border-color:var(--ice3);background:rgba(232,237,242,.06)}
.av-stoic.sel::before{content:'';position:absolute;inset:3px;border:1px solid rgba(232,237,242,.15)}
.av-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}

/* ── TICKER / DIVIDER ── */
.divider-rune{display:flex;align-items:center;gap:12px;margin:16px 0}
.divider-line{flex:1;height:1px;background:var(--border2)}
.divider-sym{font-family:'Courier New',monospace;font-size:11px;color:var(--muted);letter-spacing:2px}

/* ── TAG ── */
.tag{display:inline-block;font-size:9px;font-weight:700;letter-spacing:2px;padding:3px 10px;border:1px solid;font-family:'Courier New',monospace}
.tag-ice{border-color:rgba(232,237,242,.3);color:var(--ice2)}
.tag-blood{border-color:rgba(198,40,40,.4);color:var(--blood3)}
.tag-gold{border-color:rgba(218,165,32,.4);color:var(--gold3)}
.tag-smoke{border-color:var(--border2);color:var(--smoke)}

/* ── EMPEROR RANK ── */
.emperor-bar{
  display:flex;align-items:center;gap:10px;
  border-left:2px solid var(--gold2);
  padding:8px 12px;background:rgba(184,134,11,.04);
  margin-bottom:14px;
}
</style>
</head>

[{id:'d10a',virtue:'Coragem',t:'A Missão Impossível Pequena',d:'Identifique algo que você disse "não consigo" recentemente. Execute a primeira etapa hoje. Não o objetivo completo — apenas o primeiro passo.',icon:'🗡️',xp:35,min:'Variável'},{id:'d10b',virtue:'Temperança',t:'Alimentação como Disciplina',d:'Hoje, pare de comer antes de estar completamente cheio. Prática de temperança: o corpo como treino da vontade, não fonte de prazer imediato.',icon:'🍽️',xp:20,min:'Refeição'},{id:'d10c',virtue:'Justiça',t:'A Verdade Inconveniente',d:'Há uma verdade sobre você mesmo que você evita? Escreva-a hoje. Sem editoração. A primeira versão honesta que vier. Não precisa ser lida por ninguém.',icon:'⚖️',xp:30,min:'10 min'}],

[{id:'d16a',virtue:'Temperança',t:'A Dieta da Queixa',d:'Terceiro dia de zero reclamações. Desta vez: observe quando a reclamação emerge internamente e converta em pergunta: "O que está sob meu controle aqui?"',icon:'🔄',xp:25,min:'Dia todo'},{id:'d16b',virtue:'Prudência',t:'O Testamento Estoico',d:'Escreva o que você quer que as pessoas digam de você quando morrer. Não o que você quer ter, mas quem quer ter sido. Viva hoje conforme esse testamento.',icon:'📜',xp:35,min:'15 min'},{id:'d16c',virtue:'Coragem',t:'A Rejeição Buscada',d:'Peça algo hoje onde a probabilidade de recusado é alta. O objetivo não é conseguir — é dessensibilizar seu ego ao "não". Rejeição treina resiliência.',icon:'🎯',xp:30,min:'Variável'}],
[{id:'d17a',virtue:'Justiça',t:'O Mentor Imaginário',d:'Pense em alguém (vivo ou histórico) que exibe o autocontrole que você quer ter. Em 3 situações hoje, pause e pergunte: como essa pessoa responderia?',icon:'👤',xp:25,min:'Dia todo'},{id:'d17b',virtue:'Temperança',t:'Domínio do Apetite',d:'Identifique seu vício de conforto mais frequente (celular, comida, entretenimento). Reduz pela metade hoje. Não elimina — domina.',icon:'⚔️',xp:30,min:'Dia todo'},{id:'d17c',virtue:'Prudência',t:'A Carta Não Enviada',d:'Escreva uma carta honesta para alguém com quem tem raiva ou mágoa acumulada. Escreva tudo que quer dizer. Não envie. O exercício é a descarga, não o envio.',icon:'✉️',xp:25,min:'20 min'}],
[{id:'d18a',virtue:'Coragem',t:'72 Horas de Prova',d:'Você sobreviveu 18 dias. Identifique a situação mais difícil que enfrentou e como teria reagido no Dia 1 vs. como reagiu. Escreva a diferença.',icon:'📊',xp:30,min:'10 min'},{id:'d18b',virtue:'Temperança',t:'A Última Refeição de Sêneca',d:'Sêneca voluntariamente vivia como se tivesse pouco para treinar gratidão. Hoje: simplifique uma refeição ao mínimo necessário. Observe sua reação ao básico.',icon:'🍞',xp:20,min:'Refeição'},{id:'d18c',virtue:'Justiça',t:'Reconhecimento Público',d:'Reconheça publicamente a contribuição de alguém que normalmente não recebe crédito. Não post nas redes — diretamente para a pessoa, em palavras.',icon:'🏅',xp:25,min:'Dia todo'}],

[{id:'d20a',virtue:'Justiça',t:'O Círculo de Influência',d:'Quem em sua vida se beneficiou do seu maior autocontrole nestes 20 dias? Quem sofreu menos com sua reatividade? Escreva e reconheça o impacto.',icon:'⭕',xp:30,min:'15 min'},{id:'d20b',virtue:'Prudência',t:'Plano de Manutenção',d:'O desafio termina amanhã. Escreva o seu protocolo permanente: quais práticas destes 21 dias você vai manter? Com que frequência? Em quais situações?',icon:'📋',xp:25,min:'15 min'},{id:'d20c',virtue:'Temperança',t:'Banho de Gelo Final',d:'3 minutos de água fria novamente. Desta vez: observe que você já fez isso antes. Você sabe que pode. É mais fácil. Isso é o que o treino faz.',icon:'❄️',xp:30,min:'3 min'}],

const LESSONS=[
  {id:1,roman:'I',virtue:'Temperança',t:'A Arte do Sangue Frio — O Que os Estoicos Sabiam',dur:'9 min',icon:'🏛️',
   txt:`<div class="quote-stoic"><div class="quote-text-s">"Dois homens olham por grades da prisão. Um vê a lama, o outro as estrelas."</div><div class="quote-attr">— EPICTETO</div></div>
<p style="margin-bottom:14px;font-size:14px;color:#B0BEC5;line-height:1.85">Sangue frio não é indiferença. Não é repressão. Não é a máscara de quem engole raiva e explode depois. É a capacidade rara e treinável de criar um espaço entre o estímulo e a resposta — e escolher, nesse espaço, quem você quer ser.</p>
<p style="margin-bottom:14px;font-size:14px;color:#B0BEC5;line-height:1.85">Viktor Frankl, sobrevivente do Holocausto e fundador da Logoterapia, descreveu isso como a última liberdade humana: a liberdade de escolher sua atitude perante qualquer circunstância. Os guardas podiam tirar tudo — menos o espaço entre o que acontecia e como ele respondia.</p>
<div style="border:1px solid rgba(232,237,242,.15);padding:14px;margin:14px 0;background:rgba(232,237,242,.02)"><div style="font-size:9px;font-weight:700;letter-spacing:2px;color:#78909C;margin-bottom:8px;font-family:Courier New,monospace">🔬 NEUROCIÊNCIA</div><p style="font-size:13px;color:#B0BEC5;line-height:1.72">Daniel Kahneman (Nobel de Economia, <strong style="color:#E8EDF2">Pensando, Devagar e Depressa</strong>) documentou os dois sistemas de pensamento: Sistema 1 (rápido, emocional, impulsivo) e Sistema 2 (lento, racional, deliberado). Reatividade é o Sistema 1 no comando. <strong style="color:#E8EDF2">Sangue frio é ativar o Sistema 2 antes de agir.</strong></p></div>
<p style="margin-bottom:0;font-size:14px;color:#B0BEC5;line-height:1.85">Marco Aurélio governou o maior império do mundo enquanto perdia filhos, enfrentava guerras e lidava com traidores. Suas <em>Meditações</em> — escritas para ninguém além dele mesmo — revelam não um homem sem emoções, mas um homem que trabalhou diariamente para não ser governado por elas.</p>`},
  {id:2,roman:'II',virtue:'Dicotomia do Controle',t:'O Que Está no Seu Poder — Epicteto',dur:'7 min',icon:'⚖️',
   txt:`<div class="quote-stoic"><div class="quote-text-s">"De todas as coisas existentes, algumas estão em nosso poder e outras não."</div><div class="quote-attr">— EPICTETO — ENCHEIRÍDION, I</div></div>
<p style="margin-bottom:14px;font-size:14px;color:#B0BEC5;line-height:1.85">Epicteto nasceu escravo. Seu senhor uma vez quebrou sua perna como demonstração de poder. Enquanto a torcia, Epicteto disse calmamente: "Você vai quebrá-la." Quando quebrou, disse: "Eu disse que quebraria." Sua calma não era fraqueza — era a compreensão de que a dor era exterior, mas sua resposta era inteiramente sua.</p>
<p style="margin-bottom:14px;font-size:14px;color:#B0BEC5;line-height:1.85">A dicotomia do controle é simples e devastadora: <strong style="color:#E8EDF2">você controla seus julgamentos, impulsos, desejos e repulsas.</strong> Você não controla seu corpo na totalidade, reputação, cargos, propriedades, e os atos de outros. Sofremos quase exclusivamente com a segunda categoria.</p>
<div style="border:1px solid rgba(232,237,242,.15);padding:14px;margin:14px 0;background:rgba(232,237,242,.02)"><div style="font-size:9px;font-weight:700;letter-spacing:2px;color:#78909C;margin-bottom:8px;font-family:Courier New,monospace">🔬 PSICOLOGIA MODERNA</div><p style="font-size:13px;color:#B0BEC5;line-height:1.72">Julian Rotter (1966) desenvolveu o conceito de <strong style="color:#E8EDF2">Locus de Controle</strong>: pessoas com locus interno (acreditam que controlam seus resultados) apresentam menor ansiedade, maior resiliência e melhor desempenho sob pressão. O treinamento estoico é literalmente o desenvolvimento do locus de controle interno.</p></div>
<p style="margin-bottom:0;font-size:14px;color:#B0BEC5;line-height:1.85">Ryan Holiday, em <em>O Obstáculo É o Caminho</em>, modernizou esse princípio: o que bloqueia a ação se torna a ação. O impedimento avança. O problema não é o obstáculo — é sua relação com ele.</p>`},
  {id:3,roman:'III',virtue:'Coragem',t:'O Medo como Informação, não Comando',dur:'8 min',icon:'🗡️',
   txt:`<div class="quote-stoic"><div class="quote-text-s">"Coragem não é a ausência do medo. É agir apesar dele."</div><div class="quote-attr">— MARK TWAIN</div></div>
<p style="margin-bottom:14px;font-size:14px;color:#B0BEC5;line-height:1.85">David Goggins — ex-Navy SEAL, detentor de recordes de pull-ups, ultramaratonista — descreve o que chama de <em>The Cookie Jar</em>: um depósito mental de todas as vezes em que você superou o que achava impossível. Quando o medo surge, você vai ao pote de biscoitos e se lembra: "Já fiz coisas mais difíceis que isso."</p>
<div style="border:1px solid rgba(232,237,242,.15);padding:14px;margin:14px 0;background:rgba(232,237,242,.02)"><div style="font-size:9px;font-weight:700;letter-spacing:2px;color:#78909C;margin-bottom:8px;font-family:Courier New,monospace">🔬 NEUROCIÊNCIA DO MEDO</div><p style="font-size:13px;color:#B0BEC5;line-height:1.72">A amígdala detecta ameaças e dispara a resposta de luta-ou-fuga em <strong style="color:#E8EDF2">milissegundos</strong>, antes que o córtex pré-frontal possa avaliar racionalmente. Exposição repetida ao desconforto — como nos exercícios deste protocolo — literalmente recalibra a sensibilidade da amígdala. O medo não some. O limiar sobe.</p></div>
<p style="margin-bottom:14px;font-size:14px;color:#B0BEC5;line-height:1.85">Os estoicos distinguiam entre medo e precaução. Medo é emocional e paralisante. Precaução é racional e preparatória. A <em>premeditatio malorum</em> — premeditação dos males — era o exercício de visualizar o pior cenário não para desesperar, mas para se preparar. Quando o pior acontece, o estoico já esteve lá mentalmente.</p>
<p style="margin-bottom:0;font-size:14px;color:#B0BEC5;line-height:1.85">O banho de água fria deste protocolo não é punição. É laboratório: um ambiente controlado onde você pratica agir contra o impulso do corpo. O que você treina no banho, você usa na vida.</p>`},
  {id:4,roman:'IV',virtue:'Prudência',t:'As 4 Virtudes Estoicas',dur:'6 min',icon:'🏅',
   txt:`<div class="quote-stoic"><div class="quote-text-s">"A virtude é suficiente para a felicidade."</div><div class="quote-attr">— ZENÃO DE CÍTIO, FUNDADOR DO ESTOICISMO</div></div>
<p style="margin-bottom:14px;font-size:14px;color:#B0BEC5;line-height:1.85">O estoicismo não é sobre sentir menos — é sobre sentir melhor. As quatro virtudes cardeais estoicas são o mapa:</p>
<div style="border-left:2px solid #546E7A;padding:12px 16px;margin:12px 0;background:rgba(232,237,242,.02)"><p style="font-size:14px;color:#E8EDF2;font-weight:700;margin-bottom:4px">PRUDÊNCIA (Phronesis)</p><p style="font-size:13px;color:#B0BEC5;line-height:1.6">A capacidade de distinguir o que é bom, mau e neutro. Saber o que vale seu tempo e energia. A base de todas as outras virtudes.</p></div>
<div style="border-left:2px solid #546E7A;padding:12px 16px;margin:12px 0;background:rgba(232,237,242,.02)"><p style="font-size:14px;color:#E8EDF2;font-weight:700;margin-bottom:4px">CORAGEM (Andreia)</p><p style="font-size:13px;color:#B0BEC5;line-height:1.6">Não apenas física — moral. A capacidade de fazer o certo mesmo quando é difícil, impopular, ou assustador.</p></div>
<div style="border-left:2px solid #546E7A;padding:12px 16px;margin:12px 0;background:rgba(232,237,242,.02)"><p style="font-size:14px;color:#E8EDF2;font-weight:700;margin-bottom:4px">TEMPERANÇA (Sophrosyne)</p><p style="font-size:13px;color:#B0BEC5;line-height:1.6">Moderação e autocontrole. Não abdicação do prazer, mas domínio sobre ele. Você escolhe, não seu impulso.</p></div>
<div style="border-left:2px solid #546E7A;padding:12px 16px;margin:12px 0;background:rgba(232,237,242,.02)"><p style="font-size:14px;color:#E8EDF2;font-weight:700;margin-bottom:4px">JUSTIÇA (Dikaiosyne)</p><p style="font-size:13px;color:#B0BEC5;line-height:1.6">O tratamento justo de todos. A consciência de que somos parte de uma comunidade maior — e nossas ações têm peso moral.</p></div>`},
  {id:5,roman:'V',virtue:'Temperança',t:'A Neurociência da Raiva — e Como Domá-la',dur:'8 min',icon:'🧠',
   txt:`<div class="quote-stoic"><div class="quote-text-s">"Segure-a por um momento. Há mais dano na raiva do que em qualquer coisa que a provocou."</div><div class="quote-attr">— SÊNECA — SOBRE A IRA</div></div>
<p style="margin-bottom:14px;font-size:14px;color:#B0BEC5;line-height:1.85">Sêneca escreveu o tratado mais completo sobre raiva da antiguidade. <em>De Ira</em> (Sobre a Ira) começa com uma pergunta devastadora: existe um tipo de raiva que não prejudica mais quem a sente do que quem a recebe?</p>
<div style="border:1px solid rgba(232,237,242,.15);padding:14px;margin:14px 0;background:rgba(232,237,242,.02)"><div style="font-size:9px;font-weight:700;letter-spacing:2px;color:#78909C;margin-bottom:8px;font-family:Courier New,monospace">🔬 NEUROCIÊNCIA DA IRA</div><p style="font-size:13px;color:#B0BEC5;line-height:1.72">Pesquisas de <strong style="color:#E8EDF2">Lisa Feldman Barrett</strong> (How Emotions Are Made) mostram que emoções não são fixas — são construídas pelo cérebro com base em experiências passadas e contexto presente. <strong style="color:#E8EDF2">Você pode treinar seu cérebro a construir respostas emocionais diferentes</strong> ao mesmo gatilho.</p></div>
<p style="margin-bottom:14px;font-size:14px;color:#B0BEC5;line-height:1.85">O cortisol (hormônio do estresse) durante um episódio de raiva leva de 20 a 60 minutos para retornar ao nível basal. Qualquer decisão tomada nesse período está comprometida. O estoico sabe disso. A pausa não é fraqueza — é estratégia.</p>
<p style="margin-bottom:0;font-size:14px;color:#B0BEC5;line-height:1.85"><strong style="color:#E8EDF2">O protocolo neurocientífico da pausa:</strong> Quando sentir raiva surgir — (1) Nomeie a emoção em voz alta ou mentalmente. Apenas nomear ativa o córtex pré-frontal e reduz a atividade da amígdala. (2) 4 respirações lentas. (3) Saia fisicamente do ambiente por 2 minutos. (4) Retorne apenas quando souber o que quer dizer.</p>`},
  {id:6,roman:'VI',virtue:'Prudência',t:'Memento Mori — A Morte como Professora',dur:'7 min',icon:'💀',
   txt:`<div class="quote-stoic"><div class="quote-text-s">"Trate cada momento como se fosse o último. Comporte-se conforme."</div><div class="quote-attr">— MARCO AURÉLIO — MEDITAÇÕES</div></div>
<p style="margin-bottom:14px;font-size:14px;color:#B0BEC5;line-height:1.85"><em>Memento Mori</em> — "lembre-se de que você morrerá" — não é pessimismo. É clareza. Os estoicos usavam a contemplação da morte não para mergulhar em desespero, mas para filtrar o ruído: o que realmente importa quando colocamos tudo sob a perspectiva da finitude?</p>
<div style="border:1px solid rgba(232,237,242,.15);padding:14px;margin:14px 0;background:rgba(232,237,242,.02)"><div style="font-size:9px;font-weight:700;letter-spacing:2px;color:#78909C;margin-bottom:8px;font-family:Courier New,monospace">🔬 PSICOLOGIA</div><p style="font-size:13px;color:#B0BEC5;line-height:1.72">A Terror Management Theory (Greenberg, Pyszczynski, Solomon) demonstrou que a consciência da morte, quando processada de forma adaptativa, <strong style="color:#E8EDF2">aumenta significativamente o engajamento com valores pessoais e relações significativas</strong> — e reduz comportamentos impulsivos e fúteis.</p></div>
<p style="margin-bottom:14px;font-size:14px;color:#B0BEC5;line-height:1.85">Steve Jobs disse em seu famoso discurso de Stanford: "A morte é provavelmente a melhor invenção da vida. É o agente de mudança da vida." Não romantizava — usava como ferramenta de prioridade.</p>
<p style="margin-bottom:0;font-size:14px;color:#B0BEC5;line-height:1.85">Quando você perde a calma por algo trivial — o trânsito, uma crítica, uma fila — a pergunta estoica é: isso importará em 10 anos? Em 10 meses? Em 10 dias? A morte como perspectiva não é sobre morrer. É sobre <em>finalmente viver</em>.</p>`},
  {id:7,roman:'VII',virtue:'Justiça',t:'O Legado do Homem de Sangue Frio',dur:'9 min',icon:'👑',
   txt:`<div class="quote-stoic"><div class="quote-text-s">"O bem que você faz hoje será esquecido amanhã. Faça de qualquer jeito."</div><div class="quote-attr">— ATRIBUÍDO A MADRE TERESA</div></div>
<p style="margin-bottom:14px;font-size:14px;color:#B0BEC5;line-height:1.85">Marco Aurélio morreu sem saber que suas Meditações seriam lidas 2000 anos depois. Epicteto morreu sem saber que suas lições — transmitidas por Arriano — influenciariam desde imperadores romanos até prisioneiros de guerra americanos no Vietnã.</p>
<p style="margin-bottom:14px;font-size:14px;color:#B0BEC5;line-height:1.85">O Vice-Almirante James Stockdale passou 7 anos como prisioneiro de guerra no Vietnã — com torturas físicas e isolamento. O que o manteve são foi Epicteto. Ele mesmo disse: "Nunca perdi de vista quem eu era ou o que acreditava."</p>
<div style="border:1px solid rgba(232,237,242,.15);padding:14px;margin:14px 0;background:rgba(232,237,242,.02)"><div style="font-size:9px;font-weight:700;letter-spacing:2px;color:#78909C;margin-bottom:8px;font-family:Courier New,monospace">🔬 RESILIÊNCIA — PESQUISA</div><p style="font-size:13px;color:#B0BEC5;line-height:1.72">Martin Seligman (Psicologia Positiva) identificou que os maiores preditores de resiliência em situações extremas são: (1) senso de controle pessoal, (2) senso de propósito, (3) capacidade de contextualizar o sofrimento. <strong style="color:#E8EDF2">Os três são pilares centrais do treinamento estoico.</strong></p></div>
<p style="margin-bottom:0;font-size:14px;color:#B0BEC5;line-height:1.85">O homem de sangue frio não é aquele que nunca sangra. É aquele que sangra e continua. Que perde e não colapsa. Que é perturbado e restaura a ordem interna mais rápido a cada vez. Você não construiu perfeição em 21 dias. Construiu uma direção.</p>`},

    <div style="font-family:Courier New,monospace;font-size:9px;letter-spacing:3px;color:#546E7A;margin-bottom:10px">LIÇÃO EM DESTAQUE</div>
    <div style="display:flex;align-items:center;gap:14px">
      <div style="font-size:28px">${LESSONS[0].icon}</div>
      <div style="flex:1"><div style="font-family:Georgia,serif;font-size:14px;color:#E8EDF2;font-weight:700;margin-bottom:2px">${LESSONS[0].t}</div><div style="font-family:Courier New,monospace;font-size:10px;color:#546E7A">⏱ ${LESSONS[0].dur} • LIÇÃO ${LESSONS[0].roman}</div></div>
    </div>
    <button class="btn-stoic" style="margin-top:12px" onclick="openLesson(1)"><span>LER AGORA →</span></button>
  </div>
</div>`}

function renderMissions(){
  const ms=DAYS[S.day-1]||[];const dc=mDone(S.day);
  const virtueColors={Temperança:'#78909C',Prudência:'#B0BEC5',Coragem:'#E53935',Justiça:'#DAA520'};
  return`<div style="min-height:100vh;padding:0 16px 20px;background:linear-gradient(180deg,#0C0C0C 0%,#111111 100%)">
  <div style="padding:20px 0 14px">
    <div style="font-family:Courier New,monospace;font-size:9px;letter-spacing:3px;color:#546E7A;margin-bottom:4px">MISSIO — PROTOCOLO DIÁRIO</div>
    <div style="font-family:Georgia,serif;font-size:24px;color:#E8EDF2;margin-bottom:2px">DIA ${S.day} — ${['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI'][S.day-1]}</div>
    <div style="font-family:Courier New,monospace;font-size:11px;color:#546E7A">${dc}/${ms.length} concluídas · ${ms.reduce((a,m)=>a+m.xp,0)} XP em jogo</div>
  </div>
  <!-- Day scroll -->
  <div style="display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;-webkit-overflow-scrolling:touch">
    ${DAYS.map((_,i)=>{const d=i+1;const dn=allDone(d);const cur=d===S.day;
    return`<div style="min-width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:11px;font-family:Courier New,monospace;font-weight:700;cursor:pointer;flex-shrink:0;border:1px solid;border-color:${dn?'#546E7A':cur?'#E8EDF2':'#1A1A1A'};color:${dn?'#78909C':cur?'#E8EDF2':'#2A2A2A'};background:${dn?'rgba(84,110,122,.1)':cur?'rgba(232,237,242,.05)':'transparent'}" onclick="S.day=${d};render()">${d}</div>`;}).join('')}
  </div>
  ${ms.map((m,idx)=>{const dn=!!(S.done[dk(S.day)]||{})[m.id];const vc=virtueColors[m.virtue]||'#78909C';
  return`<div class="mission-row${dn?' done':''}" onclick="doMission(${S.day},'${m.id}')">
    <div class="mission-num${dn?' done-num':''}">${['I','II','III'][idx]}</div>
    <div class="mission-main">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <span style="font-size:16px">${m.icon}</span>
        <div style="font-family:Georgia,serif;font-size:14px;color:#E8EDF2;font-weight:700;flex:1">${m.t}</div>
      </div>
      <div style="font-size:12px;color:#546E7A;line-height:1.55;margin-bottom:8px;font-family:Georgia,serif;font-style:italic">${m.d}</div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="tag tag-ice">+${m.xp} XP</span>
        <span class="tag" style="border-color:${vc}44;color:${vc}">${m.virtue.toUpperCase()}</span>
        <span style="font-family:Courier New,monospace;font-size:10px;color:#37474F">⏱ ${m.min}</span>
      </div>
    </div>
    <div class="mission-check-stoic" style="color:${dn?'#78909C':'#2A2A2A'}">${dn?'✓':'○'}</div>
  </div>`;}).join('')}
  ${dc===ms.length&&ms.length>0?`<div class="card-frame" style="text-align:center;margin-top:8px">
    <div style="font-size:32px;margin-bottom:10px">⚔️</div>
    <div style="font-family:Georgia,serif;font-size:18px;color:#E8EDF2;margin-bottom:4px">Dia ${S.day} concluído.</div>
    <div style="font-size:13px;color:#546E7A;font-family:Georgia,serif;font-style:italic;margin-bottom:14px">O estoico avança. Sem comemoração excessiva.</div>
    ${S.day<21?`<button class="btn-stoic btn-gold" onclick="advDay()"><span>AVANÇAR — DIA ${S.day+1} →</span></button>`:`<button class="btn-stoic btn-gold"><span>👑 XXI DIAS — IMPERADOR</span></button>`}
  </div>`:''}
</div>`}

function renderLessons(){
  const lr=Object.keys(S.lr).length;
  return`<div style="min-height:100vh;padding:0 16px 20px;background:linear-gradient(180deg,#0C0C0C 0%,#0F0F0F 100%)">
  <div style="padding:20px 0 14px">
    <div style="font-family:Courier New,monospace;font-size:9px;letter-spacing:3px;color:#546E7A;margin-bottom:4px">LOGOS — FILOSOFIA APLICADA</div>
    <div style="font-family:Georgia,serif;font-size:24px;color:#E8EDF2">VII Lições Estoicas</div>
    <div style="font-family:Courier New,monospace;font-size:11px;color:#546E7A;margin-top:4px">${lr}/7 lições estudadas</div>
  </div>
  <div class="prog-segmented" style="margin-bottom:20px">
    ${Array.from({length:7},(_,i)=>`<div class="prog-seg${i<lr?' done':''}" style="height:3px"></div>`).join('')}
  </div>
  ${LESSONS.map(l=>{const rd=!!S.lr[l.id];return`<div class="scroll-card" onclick="openLesson(${l.id})">
    <div class="scroll-inner">
      <div style="font-size:26px;flex-shrink:0">${l.icon}</div>
      <div style="flex:1">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
          <span class="tag tag-smoke">LIÇÃO ${l.roman}</span>
          <span class="tag" style="border-color:rgba(232,237,242,.15);color:#78909C">${l.virtue.toUpperCase()}</span>
          ${rd?`<span class="tag tag-gold">✓ LIDO</span>`:''}
        </div>
        <div style="font-family:Georgia,serif;font-size:14px;color:#E8EDF2;font-weight:700;margin-bottom:2px">${l.t}</div>
        <div style="font-family:Courier New,monospace;font-size:10px;color:#37474F">⏱ ${l.dur}</div>
      </div>
      <div style="color:#2A2A2A;font-size:18px;flex-shrink:0">›</div>
    </div>
  </div>`;}).join('')}
</div>`}

function openLesson(id){
  const l=LESSONS.find(x=>x.id===id);if(!l)return;
  S.lr[l.id]=true;save();chkMedals();S.modal={type:'lesson',l};render();
}

function renderMedals(){
  const stats={xp:S.xp,st:S.st,lr:Object.keys(S.lr).length,td:S.td,bf:S.bf};
  const ul=MEDALS.filter(m=>m.ok(stats)).length;
  return`<div style="min-height:100vh;padding:0 16px 20px;background:linear-gradient(180deg,#0C0C0C 0%,#111111 100%)">
  <div style="padding:20px 0 14px">
    <div style="font-family:Courier New,monospace;font-size:9px;letter-spacing:3px;color:#546E7A;margin-bottom:4px">GLORIA — MEDALHAS ROMANAS</div>
    <div style="font-family:Georgia,serif;font-size:24px;color:#E8EDF2">Suas Conquistas</div>
    <div style="font-family:Courier New,monospace;font-size:11px;color:#546E7A;margin-top:4px">${ul}/${MEDALS.length} medalhas conquistadas</div>
  </div>
  <div class="prog-track" style="margin-bottom:20px"><div class="prog-fill" style="width:${Math.round(ul/MEDALS.length*100)}%"></div></div>
  <div class="col-2">${MEDALS.map(m=>{const ok=m.ok(stats);return`<div class="medal-card${ok?' won':''}"><span class="medal-icon" style="${ok?'':'filter:grayscale(1);opacity:.25'}">${m.i}</span><div class="medal-name" style="${ok?'':'color:#2A2A2A'}">${m.n}</div><div class="medal-desc">${m.d}</div>${ok?`<div style="margin-top:8px"><span class="tag tag-gold">✓ OBTIDA</span></div>`:''}</div>`;}).join('')}</div>
</div>`}

function renderProfile(){
  const rk=getRank();
  const stats={xp:S.xp,st:S.st,lr:Object.keys(S.lr).length,td:S.td,bf:S.bf};
  const ul=MEDALS.filter(m=>m.ok(stats)).length;
  return`<div style="min-height:100vh;padding:0 16px 20px;background:linear-gradient(180deg,#0C0C0C 0%,#111111 100%)">
  <div style="padding:20px 0 0;text-align:center">
    <div style="width:90px;height:90px;border:1px solid #2A2A2A;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:50px;position:relative">
      ${AVS[S.av||0]}
      <div style="position:absolute;inset:5px;border:1px solid rgba(232,237,242,.07)"></div>
    </div>
    <div style="font-family:Georgia,serif;font-size:24px;color:#E8EDF2;font-weight:700;margin-bottom:4px">${esc(S.nm)}</div>
    <div style="display:inline-flex;align-items:center;gap:8px;border:1px solid ${rk.c}44;padding:5px 14px;margin-bottom:22px">
      <span style="font-size:14px">${rk.i}</span>
      <span style="font-family:Courier New,monospace;font-size:11px;letter-spacing:2px;color:${rk.c}">${rk.n}</span>
    </div>
  </div>
  <div class="col-2" style="margin-bottom:16px">
    ${[['⚡',S.xp,'XP TOTAL','#E8EDF2'],['🔥',S.st,'STREAK','#B0BEC5'],['✓',S.td,'MISSÕES','#78909C'],['🏅',ul,'MEDALHAS','#DAA520']].map(([i,v,l,c])=>`<div class="stat-roman" style="margin-bottom:0"><div class="stat-num" style="color:${c}">${v}</div><div class="stat-lbl">${l}</div></div>`).join('')}
  </div>
  <div class="quote-stoic" style="margin-bottom:16px">
    <div class="quote-text-s">"Perde sua calma raramente. Quando perde, recupera com mais velocidade a cada vez."</div>
    <div class="quote-attr">— DAVID GOGGINS</div>
  </div>
  <div class="divider-rune"><div class="divider-line"></div><div class="divider-sym">⚡ SHAPE DE GRINGO</div><div class="divider-line"></div></div>
  <div style="font-family:Courier New,monospace;font-size:9px;letter-spacing:2px;color:#2A2A2A;text-align:center;margin:8px 0 16px">SANGUE FRIO — PROTOCOLO ESTOICO v1.0</div>
  <button class="btn-stoic" style="color:#C62828;border-color:#2A1010" onclick="S.modal={type:'reset'};render()"><span>🔄 RESETAR PROTOCOLO</span></button>
</div>`}

load();
if(S.on){
  document.getElementById('onboard').style.display='none';
  document.getElementById('app').style.display='block';
  updStreak();render();
}else{renderOb();}
</script>
</body>
</html>
