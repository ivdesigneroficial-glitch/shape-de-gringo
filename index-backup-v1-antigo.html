const cvs=document.getElementById('particles-canvas'),ctx=cvs.getContext('2d');let particles=[],pActive=false;

function animP(){if(!pActive)return;ctx.clearRect(0,0,cvs.width,cvs.height);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--;if(p.life<=0||p.y<-10){p.x=Math.random()*cvs.width;p.y=cvs.height+10;p.life=Math.random()*200+100;p.o=Math.random()*.5+.1}ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(${p.color},${p.o})`;ctx.fill()});requestAnimationFrame(animP)}
function stopParticles(){pActive=false;ctx.clearRect(0,0,cvs.width,cvs.height);cvs.style.display='none'}

function cc(){return Object.keys(S.completed).filter(k=>S.completed[k]).length}
function gRank(){const c=cc();return[...RANKS].reverse().find(r=>c>=r.min)||RANKS[0]}
